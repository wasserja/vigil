<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Vigil</title>
<style>
/* ─────────────────────────────────────────────────────────────
   VIGIL — a dark room for reading scripture
   Palette:  dark  — void #000000 · ink (warm parchment, tunable)
             light — vellum ground · iron-gall ink, never #fff/#000
             gilt #9C7F4A · ash #2A2823 · dim (muted ink)
   Every colour below goes through a token. applyLook() writes all 20
   per theme; nothing here hardcodes a tone. Dark is the priority.
   Type:     Book (Iowan/Charter) · Modern (ui-serif) · Plain (ui-sans)
   Signature: gilt chapter numeral set as a drop cap, verse numbers
             hung in the margin, and chrome that dissolves to nothing.
   ───────────────────────────────────────────────────────────── */

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--void)}
body{
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}

:root{
  --void:#000;
  --ink:#b6ab98;
  --ink-dim:#6a6358;
  --ink-faint:#3d3931;
  --gilt:#9c7f4a;
  --gilt-dim:#5c4a2b;
  --ash:#211f1b;

  /* Surface tokens. Every panel tone in the sheets goes through these so a
     theme is a set of values, not a second stylesheet. Dark values here are
     the originals; applyLook() overwrites all of them per theme. */
  --surface:#0b0a09;      /* inset: tracks, wells, unselected controls      */
  --surface-hi:#151310;   /* the same surface, pressed                      */
  --wash:#17150f;         /* gold-tinted: a selected segment                */
  --wash-hi:#20190e;      /* gold-tinted: a switch that is on               */
  --wash-soft:#100e0a;    /* gold-tinted, quieter: the chapter you are on   */
  --line:#1c1a16;         /* control borders                                */
  --line-hi:#221f1a;      /* the one border that sits a shade brighter      */
  --line-soft:#131210;    /* row dividers                                   */
  --track:#2b2822;        /* the hairline a slider thumb runs along         */
  --press:#0f0e0c;        /* a chrome button held down                      */
  --scrim:rgba(0,0,0,.72);/* behind an open sheet                           */
  --woc:#a8624f;          /* words of Jesus                                 */
  --void-0:rgba(0,0,0,0); /* --void at zero alpha, for the chrome scrims    */

  --face: "Iowan Old Style","Palatino Linotype",Palatino,"Sitka Text",Charter,"Bitstream Charter",Cambria,Georgia,serif;
  --ui: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --fs:19px;
  --lh:1.68;
  --measure:34rem;
  --pad:7vw;

  --fade:520ms;
}
@media (prefers-reduced-motion: reduce){ :root{--fade:1ms} }

/* ── shell ────────────────────────────────────────────────── */
#app{position:fixed;inset:0;background:var(--void)}

#reader{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
  /* text dissolves into black at the edges instead of hitting a hard cut */
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 54px,#000 calc(100% - 54px),transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 54px,#000 calc(100% - 54px),transparent 100%);
}

#page{
  max-width:var(--measure);
  margin:0 auto;
  padding:
    calc(env(safe-area-inset-top,0px) + 20vh)
    var(--pad)
    calc(env(safe-area-inset-bottom,0px) + 46vh);
  font-family:var(--face);
  font-size:var(--fs);
  line-height:var(--lh);
  color:var(--ink);
  font-variant-numeric:oldstyle-numeral;
  text-rendering:optimizeLegibility;
  transition:opacity 260ms ease;
}
#page.turning{opacity:0}
body[data-face="modern"] #page{font-family:ui-serif,Charter,Georgia,"Times New Roman",serif}
body[data-face="plain"]  #page{font-family:var(--ui);letter-spacing:-.005em}

/* ── the text itself ──────────────────────────────────────── */
.ref-line{
  font-family:var(--ui);
  font-size:.62rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gilt-dim);
  margin:0 0 2.4em;
}
.hd{
  font-family:var(--face);
  font-size:.86em;
  font-weight:400;
  font-style:normal;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gilt);
  opacity:.82;
  margin:2.1em 0 .9em;
  line-height:1.45;
}
.hd:first-child{margin-top:0}
.sub{
  font-style:italic;
  color:var(--ink-dim);
  margin:0 0 1.2em;
  font-size:.92em;
}
.pg{margin:0 0 1.05em}
.pg + .pg{margin-top:0}
.poem{
  margin:0;
  padding-left:calc(var(--ind,1) * 1.35em);
  text-indent:-.9em;
}
.poem + .pg{margin-top:1.05em}
.pg + .poem{margin-top:.4em}
.poem.last{margin-bottom:1.05em}
/* The hanging indent would otherwise swallow the drop cap's right margin
   and butt the first word against the numeral. Only the line carrying the
   cap opts out; the rest of the stanza keeps its hang. */
.poem.has-cap{text-indent:0}

.vn{
  font-family:var(--ui);
  font-size:.56em;
  font-variant-numeric:lining-nums;
  letter-spacing:.02em;
  color:var(--gilt);
  opacity:.72;
  vertical-align:.42em;
  margin-right:.32em;
  margin-left:.06em;
  user-select:none;
}
.pg > .vn:first-child,.poem > .vn:first-child{margin-left:0}
body[data-verses="off"] .vn{display:none}

.woc{color:var(--ink)}
body[data-woc="on"] .woc{color:var(--woc)}

/* signature: the gilt chapter numeral */
.cap{
  float:left;
  font-size:3.15em;
  line-height:.82;
  padding-top:.06em;
  margin:0 .14em -.04em 0;
  color:var(--gilt);
  font-variant-numeric:lining-nums;
  font-weight:400;
}
body[data-layout="verse"] .cap{display:none}

/* verse-per-line layout */
body[data-layout="verse"] .pg,
body[data-layout="verse"] .poem{
  margin:0 0 .62em;
  padding-left:0;
  text-indent:0;
}

.close-mark{
  margin:3.4em 0 0;
  text-align:center;
  color:var(--gilt);
  opacity:.35;
  font-size:.6em;
  letter-spacing:.6em;
}
.colophon{
  margin:2.6em 0 0;
  font-family:var(--ui);
  font-size:.62rem;
  line-height:1.7;
  letter-spacing:.06em;
  color:var(--ink-faint);
}
.colophon a{color:var(--ink-faint)}

/* ── chrome (dissolves) ───────────────────────────────────── */
.chrome{
  position:absolute;left:0;right:0;
  display:flex;align-items:center;gap:2px;
  font-family:var(--ui);
  opacity:1;
  transition:opacity var(--fade) ease, transform var(--fade) ease;
  z-index:4;
}
#topbar{
  top:0;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 14px;
  background:linear-gradient(to bottom,var(--void) 42%,var(--void-0));
}
#botbar{
  bottom:0;
  padding:20px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:linear-gradient(to top,var(--void) 42%,var(--void-0));
}
body.immersive .chrome{opacity:0;pointer-events:none}
body.immersive #topbar{transform:translateY(-6px)}
body.immersive #botbar{transform:translateY(6px)}

.btn{
  appearance:none;-webkit-appearance:none;
  background:none;border:0;
  color:var(--ink-dim);
  font:inherit;font-size:13px;
  letter-spacing:.04em;
  padding:9px 11px;
  border-radius:9px;
  cursor:pointer;
  white-space:nowrap;
  transition:color 160ms ease,background 160ms ease;
}
.btn:active{background:var(--press);color:var(--ink)}
.btn:focus-visible{outline:1.5px solid var(--gilt);outline-offset:1px}
.btn.tag{
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gilt-dim);
}
.btn.title{
  color:var(--ink);
  font-size:14px;
  letter-spacing:.02em;
}
.btn.title small{color:var(--gilt-dim);margin-left:.5em;font-size:9px;vertical-align:1px}
.btn[disabled]{opacity:.22;pointer-events:none}
.grow{flex:1}

/* reading progress hairline */
#progress{
  position:absolute;top:0;left:0;right:0;height:1px;
  z-index:6;pointer-events:none;
}
#progress i{
  display:block;height:100%;width:0;
  background:var(--gilt);
  opacity:.55;
  transition:opacity var(--fade) ease;
}
body.immersive #progress i{opacity:.16}

/* ── sheets ───────────────────────────────────────────────── */
#scrim{
  position:absolute;inset:0;z-index:8;
  background:var(--scrim);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;
  transition:opacity 240ms ease;
}
body.sheet-open #scrim{opacity:1;pointer-events:auto}

#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:9;
  max-height:86%;
  display:flex;flex-direction:column;
  background:var(--void);
  border-top:1px solid var(--ash);
  border-radius:16px 16px 0 0;
  transform:translateY(101%);
  transition:transform 300ms cubic-bezier(.22,.9,.28,1);
  font-family:var(--ui);
  color:var(--ink);
}
body.sheet-open #sheet{transform:translateY(0)}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}

.sheet-grip{
  flex:none;height:22px;display:grid;place-items:center;cursor:grab;
}
.sheet-grip::after{content:"";width:34px;height:3px;border-radius:2px;background:var(--ash)}
.sheet-head{
  flex:none;display:flex;align-items:center;gap:4px;
  padding:0 8px 8px;
}
.sheet-head h2{
  margin:0;flex:1;
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gilt-dim);font-weight:500;
  padding-left:8px;
}
.sheet-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 14px calc(env(safe-area-inset-bottom,0px) + 22px);
}

/* passage picker */
.seg{
  display:flex;gap:2px;padding:3px;margin:0 0 14px;
  background:var(--surface);border-radius:11px;
}
.seg button{
  flex:1;appearance:none;background:none;border:0;
  color:var(--ink-dim);font:inherit;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;
  padding:9px 4px;border-radius:9px;cursor:pointer;
}
.seg button[aria-selected="true"]{background:var(--wash);color:var(--gilt)}

.books{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px}
@media (min-width:560px){.books{grid-template-columns:repeat(3,1fr)}}
.books button{
  appearance:none;background:none;border:0;text-align:left;
  color:var(--ink);font:inherit;font-size:15px;
  padding:11px 8px;border-radius:8px;cursor:pointer;
  display:flex;align-items:baseline;gap:.5em;
}
.books button b{font-weight:400;flex:1}
.books button span{font-size:10px;color:var(--ink-faint);letter-spacing:.08em}
.books button[aria-current="true"]{color:var(--gilt)}
.books button:active{background:var(--press)}

.chapters{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
@media (min-width:480px){.chapters{grid-template-columns:repeat(8,1fr)}}
.chapters button{
  appearance:none;background:var(--surface);border:1px solid transparent;
  color:var(--ink);font:inherit;font-size:14px;
  aspect-ratio:1;border-radius:9px;cursor:pointer;
  font-variant-numeric:lining-nums;
}
.chapters button:active{background:var(--surface-hi)}
.chapters button[aria-current="true"]{border-color:var(--gilt-dim);color:var(--gilt);background:var(--wash-soft)}

/* settings rows */
.row{
  display:flex;align-items:center;gap:12px;
  padding:15px 8px;
  border-bottom:1px solid var(--line-soft);
}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;font-size:14px;color:var(--ink)}
.row .lbl em{
  display:block;font-style:normal;font-size:11.5px;
  color:var(--ink-faint);margin-top:3px;line-height:1.45;
}
.group-title{
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gilt-dim);padding:22px 8px 6px;
}
.pillbtn{
  appearance:none;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:12.5px;
  padding:8px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;
}
.pillbtn:active{background:var(--surface-hi)}
.pillbtn.primary{border-color:var(--gilt-dim);color:var(--gilt)}
.pillbtn[disabled]{opacity:.35;pointer-events:none}

.steps{display:flex;gap:3px;background:var(--surface);padding:3px;border-radius:10px}
.steps button{
  appearance:none;background:none;border:0;color:var(--ink-dim);
  font:inherit;font-size:12px;padding:7px 11px;border-radius:8px;cursor:pointer;
}
.steps button[aria-selected="true"]{background:var(--wash);color:var(--gilt)}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:132px;height:24px;background:none;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--track)}
input[type=range]::-moz-range-track{height:1px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--gilt);margin-top:-7px;
}
input[type=range]::-moz-range-thumb{
  width:15px;height:15px;border:0;border-radius:50%;background:var(--gilt);
}
input[type=text],input[type=password],input[type=search]{
  appearance:none;-webkit-appearance:none;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);font:inherit;font-size:13px;
  padding:11px 12px;
}
/* WebKit gives search fields their own furniture; drop it or the field
   arrives as a white box with a native cancel dot. */
input[type=search]::-webkit-search-decoration,
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
input:focus{outline:none;border-color:var(--gilt-dim)}

/* ── Search ─────────────────────────────────────────────────── */
.hit{color:var(--gilt)}
.pg{transition:background 900ms ease,box-shadow 900ms ease}
.pg.landed{background:var(--wash-soft);border-radius:5px;
  box-shadow:0 0 0 6px var(--wash-soft)}
.results{display:flex;flex-direction:column}
.results button{
  appearance:none;background:none;border:0;cursor:pointer;
  text-align:left;padding:11px 2px;border-bottom:1px solid var(--line-soft);
  font-family:var(--face);color:var(--ink-dim);font-size:14.5px;line-height:1.5;
}
.results button:last-child{border-bottom:0}
.results button:active{background:var(--surface)}
.results .rref{
  display:block;font-family:var(--ui);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gilt-dim);margin-bottom:3px;
}
.scount{
  font-family:var(--ui);font-size:11px;letter-spacing:.06em;
  color:var(--ink-faint);padding:2px 0 8px;
}

.switch{
  appearance:none;width:44px;height:26px;flex:none;
  background:var(--surface-hi);border:1px solid var(--line-hi);border-radius:14px;
  position:relative;cursor:pointer;transition:background 180ms ease;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:var(--ink-dim);transition:transform 180ms ease,background 180ms ease;
}
.switch[aria-checked="true"]{background:var(--wash-hi);border-color:var(--gilt-dim)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--gilt)}

.tlist button{
  display:flex;width:100%;align-items:baseline;gap:10px;
  appearance:none;background:none;border:0;text-align:left;
  color:var(--ink);font:inherit;font-size:14.5px;
  padding:13px 8px;border-radius:9px;cursor:pointer;
  border-bottom:1px solid var(--line-soft);
}
.tlist button b{font-weight:400}
.tlist button i{font-style:normal;font-size:11px;color:var(--ink-faint);flex:1;text-align:right}
.tlist button[aria-current="true"] b{color:var(--gilt)}

.note{
  font-size:11.5px;line-height:1.6;color:var(--ink-faint);
  padding:12px 8px 0;
}
.note a{color:var(--gilt-dim)}

/* states */
.state{
  padding:8vh 0;text-align:center;
  font-family:var(--ui);color:var(--ink-dim);
}
.state h3{
  font-family:var(--face);font-weight:400;font-size:19px;
  color:var(--ink);margin:0 0 10px;
}
.state p{font-size:13px;line-height:1.65;margin:0 auto 18px;max-width:30ch}
.spin{
  width:16px;height:16px;margin:0 auto;border-radius:50%;
  border:1px solid var(--ash);border-top-color:var(--gilt);
  animation:sp 800ms linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}

#toast{
  position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
  transform:translate(-50%,8px);
  z-index:12;pointer-events:none;
  background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font-family:var(--ui);font-size:12.5px;
  padding:9px 15px;border-radius:20px;
  opacity:0;transition:opacity 220ms ease,transform 220ms ease;
  max-width:80vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="immersive" data-face="book" data-verses="on" data-layout="para" data-woc="off">

<div id="app">
  <div id="progress"><i></i></div>

  <header id="topbar" class="chrome">
    <button class="btn title" id="btn-passage">Genesis 1 <small>▾</small></button>
    <span class="grow"></span>
    <button class="btn" id="btn-search" aria-label="Search" style="font-size:16px">&#8981;</button>
    <button class="btn tag" id="btn-trans">BSB</button>
    <button class="btn" id="btn-settings" aria-label="Reading settings" style="font-size:15px;letter-spacing:-.04em">aA</button>
  </header>

  <main id="reader">
    <article id="page"></article>
  </main>

  <footer id="botbar" class="chrome">
    <button class="btn" id="btn-prev">‹ <span></span></button>
    <span class="grow"></span>
    <button class="btn" id="btn-next"><span></span> ›</button>
  </footer>

  <div id="scrim"></div>

  <section id="sheet" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <button class="btn" id="sheet-back" hidden>‹</button>
      <h2 id="sheet-title">Passage</h2>
      <button class="btn" id="sheet-close">Done</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div id="toast"></div>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   1 · Storage — persists settings + last position + offline books
   ══════════════════════════════════════════════════════════════ */
const Store = (() => {
  const mem = new Map();
  const PREFIX = "vigil:";                 // the origin is shared with other Pages projects
  const isBook = k => k.startsWith("bk:"); // books go to IndexedDB; everything else is small

  /* localStorage — settings, last position, offline index.
     Safari in private mode has the object but throws on write, so probe it. */
  let ls = null;
  try {
    const t = PREFIX + "probe";
    localStorage.setItem(t, "1"); localStorage.removeItem(t);
    ls = localStorage;
  } catch (_) { ls = null; }

  /* IndexedDB — downloaded books, far too large for localStorage. */
  const DB = "vigil", TABLE = "books";
  let dbp = null;
  function openDB(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(DB, 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(TABLE)) d.createObjectStore(TABLE);
      };
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
      req.onblocked = () => rej(new Error("blocked"));
    }).catch(e => { dbp = null; throw e; });   // let a failed open be retried
    return dbp;
  }
  function tx(mode, fn){
    return openDB().then(d => new Promise((res, rej) => {
      const t = d.transaction(TABLE, mode);
      let out;
      t.oncomplete = () => res(out);
      t.onerror    = () => rej(t.error);
      t.onabort    = () => rej(t.error || new Error("aborted"));   // quota lands here
      const r = fn(t.objectStore(TABLE));
      if (r) r.onsuccess = () => { out = r.result; };
    }));
  }

  return {
    backed: !!ls,
    async get(key){
      if (mem.has(key)) return mem.get(key);
      let v = null;
      if (isBook(key)) {
        try { const r = await tx("readonly", s => s.get(key)); if (r != null) v = r; }
        catch (_) { return null; }                 // don't cache a miss we couldn't read
      } else if (ls) {
        try { const r = ls.getItem(PREFIX + key); if (r != null) v = JSON.parse(r); }
        catch (_) { v = null; }
      }
      mem.set(key, v);
      return v;
    },
    async set(key, value){
      mem.set(key, value);
      if (isBook(key)) {
        try { await tx("readwrite", s => s.put(value, key)); }
        catch (_) { return false; }                // out of quota, or no IndexedDB
      } else if (ls) {
        try { ls.setItem(PREFIX + key, JSON.stringify(value)); }
        catch (_) { return false; }
      }
      return true;
    },
    async del(key){
      mem.delete(key);
      if (isBook(key)) { try { await tx("readwrite", s => s.delete(key)); } catch (_) {} }
      else if (ls)     { try { ls.removeItem(PREFIX + key); } catch (_) {} }
    }
  };
})();

function step(bookId, chapter, dir){
  const i = BOOKS.findIndex(b => b.id === bookId);
  if (i < 0) return null;
  let c = chapter + dir;
  if (c >= 1 && c <= BOOKS[i].chapters) return { book: bookId, chapter: c };
  const j = i + dir;
  if (j < 0 || j >= BOOKS.length) return null;
  return { book: BOOKS[j].id, chapter: dir > 0 ? 1 : BOOKS[j].chapters };
}

/* ══════════════════════════════════════════════════════════════
   3 · Sources — HelloAO (free, no key) and Crossway ESV (your key)
   ══════════════════════════════════════════════════════════════ */
const AO = "https://bible.helloao.org";
const ESV_ENDPOINT = "https://api.esv.org/v3/passage/text/";

/* A chapter is normalised to:
   { blocks: [ {kind:'heading'|'sub'|'p'|'poem', indent, runs:[{t,v,woc}]} ],
     credit: {name, note, url} }                                            */

function Builder(){
  const blocks = [];
  let cur = null;
  return {
    blocks,
    flush(){ if (cur && !cur.runs.length) blocks.pop(); cur = null; },
    heading(text){
      this.flush();
      if (text.trim()) blocks.push({ kind:"heading", text: text.trim() });
    },
    sub(text){
      this.flush();
      if (text.trim()) blocks.push({ kind:"sub", text: text.trim() });
    },
    add(text, verse, kind, indent, woc){
      if (text == null || text === "") { if (verse == null) return; text = ""; }
      indent = indent || 0;
      if (!cur || cur.kind !== kind || cur.indent !== indent){
        this.flush();
        cur = { kind, indent, runs: [] };
        blocks.push(cur);
      }
      cur.runs.push({ t: text, v: verse, woc: !!woc });
    },
    brk(){ if (cur) { const k = cur.kind, i = cur.indent; this.flush(); cur = { kind:k, indent:i, runs:[] }; blocks.push(cur); } }
  };
}

/* ── HelloAO ───────────────────────────────────────────────── */
async function fetchAO(translation, book, chapter){
  const res = await fetch(`${AO}/api/${encodeURIComponent(translation)}/${book}/${chapter}.json`);
  if (!res.ok) throw new Error(`${res.status}`);
  const data = await res.json();
  const b = Builder();
  let pending = null;   // verse number waiting to attach to its first run

  for (const item of (data.chapter && data.chapter.content) || []){
    if (item.type === "heading"){
      b.heading((item.content || []).join(" "));
    } else if (item.type === "line_break"){
      b.flush();
    } else if (item.type === "hebrew_subtitle"){
      b.sub((item.content || []).filter(x => typeof x === "string").join(" "));
    } else if (item.type === "verse"){
      pending = item.number;
      for (const part of item.content || []){
        if (typeof part === "string"){
          b.add(part, pending, "p", 0, false); pending = null;
        } else if (part && typeof part.text === "string"){
          const poem = typeof part.poem === "number";
          b.add(part.text, pending, poem ? "poem" : "p", poem ? part.poem : 0, part.wordsOfJesus);
          pending = null;
        } else if (part && part.lineBreak){
          b.brk();
        } else if (part && typeof part.heading === "string"){
          b.heading(part.heading);
        }
        /* footnote refs ({noteId}) are intentionally dropped */
      }
    }
  }
  b.flush();

  const t = data.translation || {};
  return {
    blocks: b.blocks,
    bookName: (data.book && data.book.commonName) || byId[book].name,
    chapters: (data.book && data.book.numberOfChapters) || byId[book].chapters,
    credit: { name: t.name || translation, note: t.licenseNotes || "Free-use text via HelloAO", url: t.website || null }
  };
}

/* ── Crossway ESV ──────────────────────────────────────────── */
async function fetchESV(key, book, chapter){
  const q = `${byId[book].name} ${chapter}`;
  const params = new URLSearchParams({
    q,
    "include-passage-references":"false",
    "include-verse-numbers":"true",
    "include-first-verse-numbers":"true",
    "include-footnotes":"false",
    "include-footnote-body":"false",
    "include-headings":"true",
    "include-short-copyright":"false",
    "include-copyright":"false",
    "include-passage-horizontal-lines":"false",
    "include-heading-horizontal-lines":"false",
    "indent-using":"space",
    "indent-paragraphs":"0",
    "indent-poetry":"true",
    "indent-poetry-lines":"2",
    "indent-declares":"0",
    "indent-psalm-doxology":"0",
    "line-length":"0"
  });
  const res = await fetch(`${ESV_ENDPOINT}?${params}`, {
    headers: { Authorization: `Token ${key.trim()}` }
  });
  if (res.status === 401 || res.status === 403) throw new Error("badkey");
  if (!res.ok) throw new Error(`${res.status}`);
  const data = await res.json();
  const raw = (data.passages && data.passages[0]) || "";
  if (!raw.trim()) throw new Error("empty");
  return { blocks: parseESV(raw), bookName: byId[book].name, chapters: byId[book].chapters,
           credit: { name:"English Standard Version",
                     note:"Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.",
                     url:"https://www.esv.org" } };
}

/* The ESV text endpoint returns one line per paragraph or poetry line,
   verse markers as [n], and poetry indented in multiples of two spaces. */
function parseESV(raw){
  const b = Builder();
  const text = raw.replace(/\s*\(ESV\)\s*$/,"");
  const lines = text.split("\n");
  let seenVerse = false;

  /* ESV's paragraph indent is a server-side setting and prose can arrive
     already indented, so a leading space alone does not mean poetry.
     Measure the shallowest verse-bearing line — but only trust it as the
     zero point when nothing sits DEEPER. A passage with deeper lines is
     poetry, and there the shallowest line is poetry too, not prose.
     Without that second test a psalm loses its first indent level: every
     level-1 line flattens to prose and only its continuations stay poetry,
     which renders Psalm 23 as alternating paragraph and verse blocks. */
  let base = Infinity, deepest = 0;
  for (const line of lines){
    if (!line.trim()) continue;
    const n = (line.match(/^ */) || [""])[0].length;
    if (n > deepest) deepest = n;
    if (/\[\d+(?::\d+)?\]/.test(line)) base = Math.min(base, n);
  }
  if (!isFinite(base)) base = 0;
  if (deepest > base) base = 0;        // poetry present: indents are absolute

  for (let i = 0; i < lines.length; i++){
    const line = lines[i];
    if (!line.trim()) { b.flush(); continue; }

    /* A heading stands alone between blank lines; a line of poetry never
       does. That, not indentation, is what separates them — ESV sets the
       Hebrew letters of Psalm 119 at the SAME indent as the poetry they
       head, so an indent test loses 22 of that psalm's 23 headings. */
    const framed = (i === 0 || !lines[i-1].trim()) &&
                   (i === lines.length - 1 || !lines[i+1].trim());

    const body = line.trim();
    /* ESV keeps the verse marker in the margin and pushes a deeper poetic
       line out with spaces AFTER it, so the indent of a verse's opening
       line lives there rather than in the leading whitespace. Only the
       marker that STARTS the line counts; mid-line markers in prose are
       followed by an ordinary single space. */
    const pad = /^\[\d+(?::\d+)?\]( +)/.exec(body);
    const inner = pad ? pad[1].length - 1 : 0;
    const lead = Math.max(0, (line.match(/^ */) || [""])[0].length - base) + inner;
    const indent = Math.min(3, Math.round(lead / 2));
    const hasVerse = /\[\d+(?::\d+)?\]/.test(body);

    if (!hasVerse){
      if (!seenVerse && /[.!?]["'\u201d\u2019]?$/.test(body)) { b.sub(body); continue; }
      if (framed && body.length < 74 && !/[.,;:!?\u201d\u2019"']$/.test(body)) { b.heading(body); continue; }
    }

    const parts = body.split(/\[(\d+(?::\d+)?)\]/);
    let verse = null;
    for (let i = 0; i < parts.length; i++){
      if (i % 2 === 1){
        const m = parts[i].split(":");
        verse = parseInt(m[m.length - 1], 10);
        seenVerse = true;
      } else {
        const chunk = parts[i].replace(/\s+/g," ").trim();
        if (!chunk && verse == null) continue;
        b.add(chunk, verse, indent ? "poem" : "p", indent, false);
        verse = null;
      }
    }
  }
  b.flush();
  return b.blocks;
}

/* ══════════════════════════════════════════════════════════════
   5 · Appearance
   ══════════════════════════════════════════════════════════════ */
/* Resolve "auto" against the system. Dark is the fallback everywhere, so a
   browser with no prefers-color-scheme support stays on the OLED design. */
function effectiveTheme(){
  if (S.theme === "light") return "light";
  if (S.theme === "auto")
    return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  return "dark";
}

function applyLook(){
  const r = document.documentElement.style;
  const L = S.lum, W = S.warm;
  const light = effectiveTheme() === "light";

  if (!light){
    /* ── Dark: the point of the app. Pure black ground, warm parchment ink
       lifted off it by L. Untouched from the original. ───────────────── */
    r.setProperty("--void",      "#000");
    r.setProperty("--void-0",    "rgba(0,0,0,0)");
    r.setProperty("--ink",       `hsl(38 ${W}% ${L}%)`);
    r.setProperty("--ink-dim",   `hsl(38 ${Math.round(W*0.8)}% ${Math.round(L*0.62)}%)`);
    r.setProperty("--ink-faint", `hsl(38 ${Math.round(W*0.7)}% ${Math.round(L*0.38)}%)`);
    r.setProperty("--gilt",      `hsl(41 ${34 + Math.round(W*0.5)}% ${Math.round(L*0.74)}%)`);
    r.setProperty("--gilt-dim",  `hsl(41 ${28 + Math.round(W*0.4)}% ${Math.round(L*0.46)}%)`);
    r.setProperty("--ash",       `hsl(40 8% ${Math.max(9, Math.round(L*0.18))}%)`);
    r.setProperty("--surface",   "#0b0a09");
    r.setProperty("--surface-hi","#151310");
    r.setProperty("--wash",      "#17150f");
    r.setProperty("--wash-hi",   "#20190e");
    r.setProperty("--wash-soft", "#100e0a");
    r.setProperty("--line",      "#1c1a16");
    r.setProperty("--line-hi",   "#221f1a");
    r.setProperty("--line-soft", "#131210");
    r.setProperty("--track",     "#2b2822");
    r.setProperty("--press",     "#0f0e0c");
    r.setProperty("--scrim",     "rgba(0,0,0,.72)");
    r.setProperty("--woc",       "#a8624f");
  } else {
    /* ── Light: vellum, not white. The counterpart to the candle-lit
       psalter is the same manuscript read by daylight — so the ground is
       a warm off-white and the ink is iron-gall brown-black, never #fff
       and never #000.

       L is re-pointed rather than reused. In the dark it says how far the
       INK lifts off the page; here it says how much light the PAGE gives
       off, so dialling it down still means "less light in the room" and
       the control keeps its meaning instead of inverting under you. The
       ceiling is 97%, not 100%: a pure-white page at night is the thing
       this app exists to avoid. W still means warmth, tinting both the
       ground and the ink toward candle. ──────────────────────────────── */
    const P  = Math.round(84 + (L - 46) * 13 / 42);   /* 46..88 -> 84..97 */
    const sat = (n) => Math.round(n * 10) / 10;
    /* W*0.9, not the W*0.55 you would expect from parity with the dark
       palette: a light ground perceptually desaturates, so matching the
       numbers makes vellum read as grey. This keeps Warmth meaning the
       same thing to the eye in both themes. */
    r.setProperty("--void",      `hsl(40 ${sat(W*0.9)}% ${P}%)`);
    r.setProperty("--void-0",    `hsl(40 ${sat(W*0.9)}% ${P}% / 0)`);
    r.setProperty("--ink",       `hsl(34 ${sat(12 + W*0.7)}% 18%)`);
    r.setProperty("--ink-dim",   `hsl(34 ${sat(10 + W*0.5)}% 40%)`);
    r.setProperty("--ink-faint", `hsl(34 ${sat(8 + W*0.4)}% 52%)`);
    r.setProperty("--gilt",      "hsl(38 66% 28%)");
    r.setProperty("--gilt-dim",  "hsl(38 48% 38%)");
    r.setProperty("--ash",       `hsl(40 12% ${P-11}%)`);
    r.setProperty("--surface",   `hsl(40 ${sat(W*0.8)}% ${P-4}%)`);
    r.setProperty("--surface-hi",`hsl(40 ${sat(W*0.8)}% ${P-9}%)`);
    r.setProperty("--wash",      `hsl(42 40% ${P-7}%)`);
    r.setProperty("--wash-hi",   `hsl(42 52% ${P-11}%)`);
    r.setProperty("--wash-soft", `hsl(42 30% ${P-5}%)`);
    r.setProperty("--line",      `hsl(40 10% ${P-14}%)`);
    r.setProperty("--line-hi",   `hsl(40 10% ${P-19}%)`);
    r.setProperty("--line-soft", `hsl(40 10% ${P-7}%)`);
    r.setProperty("--track",     `hsl(40 10% ${P-18}%)`);
    r.setProperty("--press",     `hsl(40 ${sat(W*0.8)}% ${P-12}%)`);
    r.setProperty("--scrim",     "rgba(28,24,17,.34)");
    r.setProperty("--woc",       "#8f3f2c");
  }

  document.body.dataset.theme = light ? "light" : "dark";
  /* Safari and Android chrome tint their UI from this. iOS reads the
     status-bar meta once at launch and cannot be re-pointed later, which
     is a known limit — see the note in CLAUDE.md. */
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute("content",
    light ? getComputedStyle(document.documentElement).getPropertyValue("--void").trim() || "#eae4d8"
          : "#000000");

  r.setProperty("--fs", S.fs + "px");
  r.setProperty("--lh", S.lh);
  r.setProperty("--measure", S.measure + "rem");
  document.body.dataset.face   = S.face;
  document.body.dataset.verses = S.verses;
  document.body.dataset.layout = S.layout;
  document.body.dataset.woc    = S.woc;
}

/* ══════════════════════════════════════════════════════════════
   6 · Rendering
   ══════════════════════════════════════════════════════════════ */
function renderChapter(ch){
  const page = $("#page");
  page.innerHTML = "";

  const ref = el("p","ref-line", `${ch.bookName} ${S.chapter} · ${S.translation}`);
  page.appendChild(ref);

  const blocks = S.layout === "verse" ? toVerseLines(ch.blocks) : ch.blocks;
  let capUsed = false;

  blocks.forEach((blk, i) => {
    if (blk.kind === "heading"){ page.appendChild(el("h2","hd", blk.text)); return; }
    if (blk.kind === "sub"){ page.appendChild(el("p","sub", blk.text)); return; }

    const p = el("p", blk.kind === "poem" ? "pg poem" : "pg");
    if (blk.kind === "poem"){
      p.style.setProperty("--ind", String(Math.max(1, blk.indent || 1)));
      const nxt = blocks[i+1];
      if (!nxt || nxt.kind !== "poem") p.classList.add("last");
    }

    let first = true;
    let tail = "";          // last text written, so spacing stays single
    let afterMark = false;  // a verse number or the numeral already supplies the gap

    for (const run of blk.runs){
      if (run.v != null){
        if (first && !capUsed && S.layout !== "verse"){
          const cap = el("span","cap", String(S.chapter));
          cap.dataset.v = String(run.v);        // the numeral stands in for verse 1's number
          p.appendChild(cap);
          p.classList.add("has-cap");
          capUsed = true;
        } else {
          const vn = el("span","vn", String(run.v));
          vn.dataset.v = String(run.v);
          p.appendChild(vn);
        }
        afterMark = true;
      }
      if (run.t){
        const needsSpace = !afterMark && tail && !/[\s\u201c(]$/.test(tail) && !/^[\s.,;:!?)\u201d\u2019]/.test(run.t);
        const t = el("span", run.woc ? "woc" : null);
        t.textContent = (needsSpace ? " " : "") + run.t;
        p.appendChild(t);
        tail = run.t;
        afterMark = false;
      }
      first = false;
    }
    if (p.childNodes.length) page.appendChild(p);
  });

  page.appendChild(el("div","close-mark","\u25c6"));

  const col = el("div","colophon");
  col.appendChild(document.createTextNode(ch.credit.name + " \u00b7 "));
  if (ch.credit.url){
    const a = el("a", null, ch.credit.url.replace(/^https?:\/\//,"").replace(/\/$/,""));
    a.href = ch.credit.url; a.target = "_blank"; a.rel = "noopener";
    col.appendChild(a);
    col.appendChild(el("br"));
  }
  if (ch.credit.note) col.appendChild(document.createTextNode(ch.credit.note));
  page.appendChild(col);

  $("#reader").scrollTop = 0;
  updateProgress();
}

function toVerseLines(blocks){
  const out = [];
  let cur = null;
  for (const blk of blocks){
    if (blk.kind === "heading" || blk.kind === "sub"){ out.push(blk); cur = null; continue; }
    for (const run of blk.runs){
      if (run.v != null || !cur){ cur = { kind:"p", indent:0, runs:[] }; out.push(cur); }
      cur.runs.push(run);
    }
  }
  return out.filter(b => b.kind !== "p" || b.runs.length);
}

function showState(title, body, action){
  const page = $("#page");
  page.innerHTML = "";
  const box = el("div","state");
  if (title === null){ box.appendChild(el("div","spin")); }
  else {
    box.appendChild(el("h3", null, title));
    if (body) box.appendChild(el("p", null, body));
    if (action){
      const btn = el("button","pillbtn primary", action.label);
      btn.onclick = action.run;
      box.appendChild(btn);
    }
  }
  page.appendChild(box);
  showChrome();
}

   ══════════════════════════════════════════════════════════════ */
async function getChapter(book, chapter){
  const key = `${S.translation}/${book}/${chapter}`;
  if (chapterCache.has(key)) return chapterCache.get(key);

  const saved = await Store.get(`bk:${S.translation}:${book}`);
  if (saved && saved[chapter]){
    for (const [c, v] of Object.entries(saved)) chapterCache.set(`${S.translation}/${book}/${c}`, v);
    offlineBooks.add(`${S.translation}/${book}`);
    return saved[chapter];
  }

  const data = S.translation === "ESV"
    ? await fetchESV(S.esvKey, book, chapter)
    : await fetchAO(S.translation, book, chapter);
  chapterCache.set(key, data);
  return data;
}

let loadToken = 0;
async function open(book, chapter, { animate = true, verse = null } = {}){
  if (!byId[book]) { book = "JHN"; chapter = 1; }   // never let a bad id reach state
  const mine = ++loadToken;
  S.book = book; S.chapter = chapter;
  syncChrome();

  if (S.translation === "ESV" && !S.esvKey){
    showState("An ESV key is needed", "The ESV is licensed text, so it can only be read live from Crossway's API with your own key.",
      { label:"Add key", run:() => openSheet("translations") });
    return;
  }

  const page = $("#page");
  if (animate) page.classList.add("turning");

  let data;
  try {
    data = await getChapter(book, chapter);
  } catch (err){
    if (mine !== loadToken) return;
    page.classList.remove("turning");
    if (String(err.message) === "badkey"){
      showState("That key was refused", "Crossway returned 401. Check the key, and make sure the application is approved at api.esv.org.",
        { label:"Edit key", run:() => openSheet("translations") });
    } else if (`${S.translation}/${book}/${chapter}` === `${S.translation}/PSA/23` || (book === "PSA" && chapter === 23)){
      renderChapter(SAMPLE.data);
      toast("Offline — showing the bundled sample");
    } else {
      showState("No connection to the text", "The reader couldn't reach the translation server. Try again, or read Psalm 23 from the copy bundled in this file.",
        { label:"Try again", run:() => open(book, chapter) });
    }
    return;
  }
  if (mine !== loadToken) return;

  if (data.chapters && byId[book]) byId[book].chapters = data.chapters;
  renderChapter(data);
  page.classList.remove("turning");
  if (verse != null) landOn(verse);
  syncChrome();
  save();
  prefetchNeighbours(book, chapter);
}

/* Scroll a verse into view and let it glow once, so an arrival from search
   does not dump you at the top of a chapter to hunt for the line. */
function landOn(verse){
  const mark = $(`#page [data-v="${verse}"]`);
  if (!mark) return;
  const reader = $("#reader");
  /* a third of the way down reads better than dead-centre: the verse keeps
     the lines that lead into it. */
  const top = mark.offsetTop - reader.clientHeight / 3;
  reader.scrollTo({ top: Math.max(0, top), behavior: "auto" });
  const line = mark.closest(".pg") || mark;
  line.classList.add("landed");
  setTimeout(() => line.classList.remove("landed"), 1600);
}

function prefetchNeighbours(book, chapter){
  for (const dir of [1, -1]){
    const n = step(book, chapter, dir);
    if (!n) continue;
    const key = `${S.translation}/${n.book}/${n.chapter}`;
    if (chapterCache.has(key)) continue;
    (S.translation === "ESV"
      ? (S.esvKey ? fetchESV(S.esvKey, n.book, n.chapter) : Promise.reject())
      : fetchAO(S.translation, n.book, n.chapter)
    ).then(d => chapterCache.set(key, d)).catch(() => {});
  }
}

function go(dir){
  const n = step(S.book, S.chapter, dir);
  if (n) open(n.book, n.chapter);
}

/* ══════════════════════════════════════════════════════════════
   7b · Search — over the books you have saved for offline reading

   HelloAO has no search endpoint, so the corpus is what is already on
   the device. That is the honest constraint, not a limitation to
   apologise for: it works with no signal, which is when this app is
   used, and it never sends a query anywhere.

   ESV is deliberately absent. Its text may not be stored, so there are
   no ESV books to search — the sheet says so rather than silently
   returning nothing.

   No inverted index. A linear scan over the flattened corpus costs one
   toLowerCase per verse, which is a few tens of milliseconds even for a
   whole Bible, and it avoids a second persisted structure that would
   have to be rebuilt whenever a book is added or removed.
   ══════════════════════════════════════════════════════════════ */
const canonOrder = Object.fromEntries(BOOKS.map((b, i) => [b.id, i]));
let corpusCache = new Map();            // tid -> [{b,c,v,t}], built on demand

function flattenChapter(ch, bookId, chapterNo, out){
  let v = null, buf = "";
  const flush = () => {
    if (v == null) return;
    const t = buf.replace(/\s+/g, " ").trim();
    if (t) out.push({ b: bookId, c: chapterNo, v, t });
  };
  for (const blk of ch.blocks || []){
    if (!blk.runs) continue;            // headings and Hebrew subtitles are not verses
    for (const run of blk.runs){
      if (run.v != null){ flush(); v = run.v; buf = ""; }
      if (run.t) buf += " " + run.t;
    }
  }
  flush();
}

async function buildCorpus(tid, onProgress){
  if (corpusCache.has(tid)) return corpusCache.get(tid);
  const ids = [...offlineBooks]
    .filter(k => k.startsWith(tid + "/"))
    .map(k => k.slice(tid.length + 1))
    .sort((a, b) => canonOrder[a] - canonOrder[b]);
  const out = [];
  let done = 0;
  for (const bookId of ids){
    const data = await Store.get(`bk:${tid}:${bookId}`);
    if (data){
      for (const c of Object.keys(data).map(Number).sort((a, b) => a - b))
        flattenChapter(data[c], bookId, c, out);
    }
    if (onProgress) onProgress(++done, ids.length);
  }
  corpusCache.set(tid, out);
  return out;
}

/* A quoted query is a phrase; anything else is an AND over its words. */
function parseQuery(q){
  const phrase = /^\s*"(.+)"\s*$/.exec(q);
  if (phrase) return { phrase: phrase[1].toLowerCase().trim() };
  const terms = q.toLowerCase().split(/[^\p{L}\p{N}'\u2019]+/u).filter(Boolean);
  return { terms };
}

const SEARCH_CAP = 300;
function runSearch(corpus, q){
  const parsed = parseQuery(q);
  const hits = [];
  let total = 0;
  for (const r of corpus){
    const n = r.t.toLowerCase();
    const ok = parsed.phrase ? n.includes(parsed.phrase)
                             : parsed.terms.every(w => n.includes(w));
    if (!ok) continue;
    total++;
    if (hits.length < SEARCH_CAP) hits.push(r);
  }
  return { hits, total, parsed };
}

/* Build the verse text as nodes, with matches wrapped — never innerHTML,
   because scripture is not ours to inject markup into. */
function highlight(text, parsed){
  const frag = document.createDocumentFragment();
  const needles = (parsed.phrase ? [parsed.phrase] : parsed.terms)
    .filter(Boolean).sort((a, b) => b.length - a.length);
  if (!needles.length){ frag.appendChild(document.createTextNode(text)); return frag; }
  const low = text.toLowerCase();
  let i = 0;
  while (i < text.length){
    let at = -1, len = 0;
    for (const w of needles){
      const j = low.indexOf(w, i);
      if (j !== -1 && (at === -1 || j < at)){ at = j; len = w.length; }
    }
    if (at === -1){ frag.appendChild(document.createTextNode(text.slice(i))); break; }
    if (at > i) frag.appendChild(document.createTextNode(text.slice(i, at)));
    const m = el("span","hit"); m.textContent = text.slice(at, at + len);
    frag.appendChild(m);
    i = at + len;
  }
  return frag;
}

/* ══════════════════════════════════════════════════════════════
   8 · Chrome + immersion
   ══════════════════════════════════════════════════════════════ */
let hideTimer = null;

function showChrome(){
  document.body.classList.remove("immersive");
  clearTimeout(hideTimer);
  if (S.autohide && !document.body.classList.contains("sheet-open")){
    hideTimer = setTimeout(hideChrome, 2800);
  }
}
function hideChrome(){
  if (document.body.classList.contains("sheet-open")) return;
  clearTimeout(hideTimer);
  document.body.classList.add("immersive");
}
function toggleChrome(){
  document.body.classList.contains("immersive") ? showChrome() : hideChrome();
}

function syncChrome(){
  const name = (byId[S.book] || {}).name || S.book;
  $("#btn-passage").innerHTML = "";
  $("#btn-passage").append(document.createTextNode(`${name} ${S.chapter} `), Object.assign(document.createElement("small"), { textContent:"▾" }));
  $("#btn-trans").textContent = S.translation;

  for (const [id, dir] of [["#btn-prev",-1],["#btn-next",1]]){
    const n = step(S.book, S.chapter, dir);
    const btn = $(id);
    btn.disabled = !n;
    btn.querySelector("span").textContent = n ? `${(byId[n.book]||{}).name} ${n.chapter}` : "";
  }
}

function updateProgress(){
  const r = $("#reader");
  const max = r.scrollHeight - r.clientHeight;
  const pct = max > 8 ? Math.min(1, r.scrollTop / max) : 0;
  $("#progress i").style.width = (pct * 100).toFixed(2) + "%";
}

/* ══════════════════════════════════════════════════════════════
   9 · Sheets
   ══════════════════════════════════════════════════════════════ */
let sheetView = null;
let pickedBook = null;

function openSheet(view){
  sheetView = view;
  document.body.classList.add("sheet-open");
  showChrome();
  clearTimeout(hideTimer);
  drawSheet();
}
function closeSheet(){
  document.body.classList.remove("sheet-open");
  sheetView = null; pickedBook = null;
  showChrome();
}

function drawSheet(){
  const body = $("#sheet-body");
  const back = $("#sheet-back");
  body.innerHTML = "";
  back.hidden = true;

  if (sheetView === "passage"){
    $("#sheet-title").textContent = pickedBook ? (byId[pickedBook].name) : "Passage";
    if (pickedBook){ back.hidden = false; drawChapters(body); }
    else drawBooks(body);
  } else if (sheetView === "settings"){
    $("#sheet-title").textContent = "Reading";
    drawSettings(body);
  } else if (sheetView === "translations"){
    $("#sheet-title").textContent = "Translation";
    drawTranslations(body);
  } else if (sheetView === "search"){
    $("#sheet-title").textContent = "Search";
    drawSearch(body);
  }
}

let testament = null;
function drawBooks(body){
  if (testament === null) testament = byId[S.book] && byId[S.book].ot ? "ot" : "nt";

  const seg = el("div","seg");
  for (const [k, label] of [["ot","Old Testament"],["nt","New Testament"]]){
    const b = el("button", null, label);
    b.setAttribute("aria-selected", String(testament === k));
    b.onclick = () => { testament = k; drawSheet(); };
    seg.appendChild(b);
  }
  body.appendChild(seg);

  const grid = el("div","books");
  for (const bk of BOOKS.filter(b => (testament === "ot") === b.ot)){
    const b = el("button");
    b.append(el("b", null, bk.name), el("span", null, String(bk.chapters)));
    if (bk.id === S.book) b.setAttribute("aria-current","true");
    b.onclick = () => {
      if (bk.chapters === 1){ closeSheet(); open(bk.id, 1); return; }
      pickedBook = bk.id; drawSheet(); body.scrollTop = 0;
    };
    grid.appendChild(b);
  }
  body.appendChild(grid);
}

function drawChapters(body){
  const grid = el("div","chapters");
  const bookId = pickedBook;           // closeSheet() clears pickedBook, so hold it here
  const bk = byId[bookId];
  for (let c = 1; c <= bk.chapters; c++){
    const b = el("button", null, String(c));
    if (bookId === S.book && c === S.chapter) b.setAttribute("aria-current","true");
    b.onclick = () => { closeSheet(); open(bookId, c); };
    grid.appendChild(b);
  }
  body.appendChild(grid);
}

function drawSettings(body){
  const add = (n) => body.appendChild(n);
  const group = (t) => add(el("div","group-title", t));

  const row = (label, hint, control) => {
    const r = el("div","row");
    const l = el("div","lbl", label);
    if (hint) l.appendChild(Object.assign(document.createElement("em"), { textContent: hint }));
    r.append(l, control);
    add(r);
    return r;
  };

  const steps = (options, current, onPick) => {
    const wrap = el("div","steps");
    for (const [val, label] of options){
      const b = el("button", null, label);
      b.setAttribute("aria-selected", String(current === val));
      b.onclick = () => { onPick(val); applyLook(); redrawKeepScroll(); drawSheet(); save(); };
      wrap.appendChild(b);
    }
    return wrap;
  };

  const slider = (min, max, stepSize, value, onInput) => {
    const i = document.createElement("input");
    i.type = "range"; i.min = min; i.max = max; i.step = stepSize; i.value = value;
    i.oninput = () => { onInput(parseFloat(i.value)); applyLook(); updateProgress(); };
    i.onchange = save;
    return i;
  };

  const toggle = (checked, onChange) => {
    const t = el("button","switch");
    t.setAttribute("role","switch");
    t.setAttribute("aria-checked", String(checked));
    t.onclick = () => { onChange(!(t.getAttribute("aria-checked") === "true")); drawSheet(); save(); };
    return t;
  };

  group("Light");
  row("Theme", S.theme === "auto"
        ? `Following the system — ${effectiveTheme() === "light" ? "light" : "dark"} right now.`
        : "Dark is pure black, for an OLED screen at night.",
      steps([["dark","Dark"],["light","Light"],["auto","Auto"]], S.theme,
            v => S.theme = v));
  row("Brightness",
      effectiveTheme() === "light"
        ? "How much light the page gives off."
        : "How far the text lifts off the black.",
      slider(46, 88, 1, S.lum, v => S.lum = v));
  row("Warmth", "Pulls the ink from cool grey toward candlelight.", slider(0, 26, 1, S.warm, v => S.warm = v));

  group("Type");
  row("Size", null, slider(15, 30, 1, S.fs, v => S.fs = v));
  row("Line height", null, steps([[1.5,"Tight"],[1.68,"Normal"],[1.92,"Airy"]], S.lh, v => S.lh = v));
  row("Column", null, steps([[26,"Narrow"],[34,"Medium"],[44,"Wide"]], S.measure, v => S.measure = v));
  row("Face", null, steps([["book","Book"],["modern","Modern"],["plain","Plain"]], S.face, v => S.face = v));

  group("Page");
  row("Verse numbers", null, steps([["on","Show"],["off","Hide"]], S.verses, v => S.verses = v));
  row("Layout", "Flowing paragraphs, or one verse per line.", steps([["para","Paragraph"],["verse","Verse"]], S.layout, v => S.layout = v));
  row("Words of Jesus", "Tint them a muted red.", steps([["off","Off"],["on","On"]], S.woc, v => S.woc = v));

  group("Reading");
  row("Hide controls automatically", "Or keep the bars up until you tap.",
      toggle(S.autohide, v => { S.autohide = v; v ? showChrome() : (clearTimeout(hideTimer), document.body.classList.remove("immersive")); }));
  row("Keep the screen awake", "Stops the display dimming mid-chapter.",
      toggle(S.awake, v => { S.awake = v; v ? requestWake() : releaseWake(); }));

  group("Translation");
  const tr = el("div","row");
  tr.append(el("div","lbl", S.translationName || S.translation));
  const chg = el("button","pillbtn","Change");
  chg.onclick = () => openSheet("translations");
  tr.appendChild(chg);
  add(tr);

  group("Offline");
  const bk = byId[S.book];
  const dl = el("div","row");
  const lbl = el("div","lbl", `${bk.name} \u00b7 ${bk.chapters} chapter${bk.chapters>1?"s":""}`);
  const stored = offlineBooks.has(`${S.translation}/${S.book}`);
  lbl.appendChild(Object.assign(document.createElement("em"), {
    textContent: S.translation === "ESV"
      ? "The ESV licence doesn't allow storing a local copy — it stays live."
      : (stored ? "Saved on this device." : "Save every chapter of this book for reading without a signal.")
  }));
  const dlBtn = el("button", "pillbtn" + (stored ? "" : " primary"), stored ? "Remove" : "Download");
  dlBtn.disabled = S.translation === "ESV";
  dlBtn.onclick = () => stored ? removeBook(dlBtn) : downloadBook(dlBtn);
  dl.append(lbl, dlBtn);
  add(dl);

  if (!Store.backed){
    add(Object.assign(el("div","note"), { textContent:"Storage isn't available here, so settings and downloads last only for this session. Hosted on your own domain, they persist." }));
  }
}

let searchQ = "";                 // survives a redraw, so the field keeps its text
let searchSeq = 0;                // guards against a slow corpus build landing late

function drawSearch(body){
  const wrap = el("div");
  const input = document.createElement("input");
  input.type = "search"; input.placeholder = "Search the books you have saved";
  input.value = searchQ; input.autocapitalize = "none"; input.autocorrect = "off";
  input.spellcheck = false;
  wrap.appendChild(input);

  const status = el("div","scount");
  const list = el("div","results");
  wrap.append(status, list);
  body.appendChild(wrap);

  const saved = [...offlineBooks].filter(k => k.startsWith(S.translation + "/"));

  if (S.translation === "ESV"){
    list.appendChild(Object.assign(el("div","note"), { textContent:
      "The ESV is licensed text and cannot be stored on the device, so there is nothing " +
      "saved here to search. Switch to a public-domain translation and download a book first." }));
    input.disabled = true;
    return;
  }
  if (!saved.length){
    list.appendChild(Object.assign(el("div","note"), { textContent:
      "Search looks through the books you have saved for offline reading, so it works with " +
      "no signal and never sends your query anywhere. Download a book from the passage " +
      "list and it will appear here." }));
    return;
  }

  const render = async () => {
    const mine = ++searchSeq;
    const q = searchQ.trim();
    list.innerHTML = "";
    if (q.length < 2){
      status.textContent = `${saved.length} book${saved.length === 1 ? "" : "s"} saved · type to search`;
      return;
    }
    status.textContent = "Searching\u2026";
    const corpus = await buildCorpus(S.translation,
      (d, t) => { if (mine === searchSeq && t > 1) status.textContent = `Reading ${d}/${t}\u2026`; });
    if (mine !== searchSeq) return;          // a newer keystroke already won

    const { hits, total, parsed } = runSearch(corpus, q);
    if (!total){ status.textContent = "No verses found."; return; }

    const books = new Set(hits.map(h => h.b));
    status.textContent = `${total} verse${total === 1 ? "" : "s"} in ` +
      (books.size === 1 ? byId[[...books][0]].name : `${books.size} books`) +
      (total > hits.length ? ` \u00b7 showing the first ${hits.length}` : "");

    const frag = document.createDocumentFragment();
    for (const h of hits){
      const b = el("button");
      b.appendChild(el("span","rref", `${byId[h.b].name} ${h.c}:${h.v}`));
      b.appendChild(highlight(h.t, parsed));
      /* Capture before closing: closeSheet() tears down sheet state, and
         arguments evaluate after it runs. */
      const bk = h.b, ch = h.c, vs = h.v;
      b.onclick = () => { closeSheet(); open(bk, ch, { verse: vs }); };
      frag.appendChild(b);
    }
    list.appendChild(frag);
  };

  let t;
  input.oninput = () => { searchQ = input.value; clearTimeout(t); t = setTimeout(render, 160); };
  input.onkeydown = (e) => { if (e.key === "Enter"){ e.preventDefault(); clearTimeout(t); render(); } };
  render();
  if (!searchQ) setTimeout(() => input.focus(), 60);
}

async function drawTranslations(body){
  const back = $("#sheet-back");
  back.hidden = false;

  const esv = el("div");
  esv.appendChild(Object.assign(el("div","group-title"), { textContent:"English Standard Version" }));
  const keyRow = el("div","row");
  keyRow.style.display = "block";
  const input = document.createElement("input");
  input.type = "password"; input.placeholder = "ESV API key"; input.value = S.esvKey;
  input.autocomplete = "off"; input.spellcheck = false;
  keyRow.appendChild(input);
  const useBtn = el("button","pillbtn primary","Read the ESV");
  useBtn.style.marginTop = "10px";
  useBtn.onclick = () => {
    S.esvKey = input.value.trim();
    if (!S.esvKey) { toast("Enter a key first"); return; }
    S.translation = "ESV"; S.translationName = "English Standard Version";
    chapterCache.clear(); save(); closeSheet(); open(S.book, S.chapter);
  };
  keyRow.appendChild(useBtn);
  esv.appendChild(keyRow);
  esv.appendChild(Object.assign(el("div","note"), {
    innerHTML: 'Keys are free for personal use from <a href="https://api.esv.org" target="_blank" rel="noopener">api.esv.org</a>. The key stays on this device and is sent only to Crossway.'
  }));
  body.appendChild(esv);

  body.appendChild(Object.assign(el("div","group-title"), { textContent:"Free to read and to keep" }));
  const list = el("div","tlist");
  body.appendChild(list);

  if (!translations){
    const load = el("div","state"); load.appendChild(el("div","spin"));
    list.appendChild(load);
    try {
      const res = await fetch(`${AO}/api/available_translations.json`);
      const data = await res.json();
      translations = (data.translations || data || [])
        .filter(t => (t.language === "eng" || t.languageEnglishName === "English"))
        .sort((a,b) => (a.englishName||a.name).localeCompare(b.englishName||b.name));
    } catch (_){
      translations = [{ id:"BSB", name:"Berean Standard Bible", englishName:"Berean Standard Bible", licenseNotes:"public domain" }];
    }
    if (sheetView !== "translations") return;
    list.innerHTML = "";
  }

  for (const t of translations){
    const b = el("button");
    b.append(el("b", null, t.englishName || t.name), el("i", null, t.id));
    if (t.id === S.translation) b.setAttribute("aria-current","true");
    b.onclick = () => {
      S.translation = t.id;
      S.translationName = t.englishName || t.name;
      chapterCache.clear();
      save(); closeSheet(); open(S.book, S.chapter);
    };
    list.appendChild(b);
  }
}

/* ══════════════════════════════════════════════════════════════
   10 · Offline download
   ══════════════════════════════════════════════════════════════ */
async function downloadBook(btn){
  const bookId = S.book, tid = S.translation, bk = byId[bookId];
  btn.disabled = true;
  const nums = Array.from({ length: bk.chapters }, (_, i) => i + 1);
  const out = {};
  let done = 0, failed = false;

  const label = () => { btn.textContent = `${done}/${bk.chapters}`; };
  label();

  const worker = async () => {
    while (nums.length && !failed){
      const c = nums.shift();
      try {
        const key = `${tid}/${bookId}/${c}`;
        const data = chapterCache.get(key) || await fetchAO(tid, bookId, c);
        chapterCache.set(key, data);
        out[c] = data;
      } catch (_){ failed = true; }
      done++; label();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);

  btn.disabled = false;
  if (failed){ btn.textContent = "Download"; toast("Download stopped — check the connection"); return; }

  const ok = await Store.set(`bk:${tid}:${bookId}`, out);
  if (!ok){ btn.textContent = "Download"; toast("That book was too large to store"); return; }
  offlineBooks.add(`${tid}/${bookId}`);
  corpusCache.delete(tid);                  // the shelf changed; rebuild on next search
  const idx = (await Store.get("offline")) || [];
  if (!idx.includes(`${tid}/${bookId}`)) { idx.push(`${tid}/${bookId}`); await Store.set("offline", idx); }
  toast(`${bk.name} saved for offline`);
  drawSheet();
}

async function removeBook(btn){
  btn.disabled = true;
  await Store.del(`bk:${S.translation}:${S.book}`);
  offlineBooks.delete(`${S.translation}/${S.book}`);
  corpusCache.delete(S.translation);
  const idx = ((await Store.get("offline")) || []).filter(k => k !== `${S.translation}/${S.book}`);
  await Store.set("offline", idx);
  btn.disabled = false;
  toast(`${byId[S.book].name} removed`);
  drawSheet();
}

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}

async function requestWake(){
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch (_) { S.awake = false; toast("This browser won't keep the screen on"); }
}
function releaseWake(){ if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.awake && !wakeLock) requestWake();
});

function redrawKeepScroll(){
  const r = $("#reader");
  const ratio = r.scrollHeight > r.clientHeight ? r.scrollTop / (r.scrollHeight - r.clientHeight) : 0;
  const cached = chapterCache.get(`${S.translation}/${S.book}/${S.chapter}`);
  if (!cached) return;
  renderChapter(cached);
  requestAnimationFrame(() => {
    r.scrollTop = ratio * Math.max(0, r.scrollHeight - r.clientHeight);
    updateProgress();
  });
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    Store.set("settings", {
      translation:S.translation, translationName:S.translationName, esvKey:S.esvKey,
      theme:S.theme, lum:S.lum, warm:S.warm, fs:S.fs, lh:S.lh, measure:S.measure,
      face:S.face, verses:S.verses, layout:S.layout, woc:S.woc,
      awake:S.awake, autohide:S.autohide
    });
    Store.set("position", { book:S.book, chapter:S.chapter });
  }, 250);
}

/* ══════════════════════════════════════════════════════════════
   12 · Input
   ══════════════════════════════════════════════════════════════ */
const reader = $("#reader");

let lastY = 0, accUp = 0;
reader.addEventListener("scroll", () => {
  updateProgress();
  const y = reader.scrollTop;
  const dy = y - lastY;
  if (dy > 4){ accUp = 0; hideChrome(); }
  else if (dy < 0){
    accUp += -dy;
    if (accUp > 26 || y < 12){ accUp = 0; showChrome(); }
  }
  lastY = y;
}, { passive: true });

reader.addEventListener("click", (e) => {
  if (e.target.closest("a,button")) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;
  toggleChrome();
});

let tx = 0, ty = 0, tt = 0, swiping = false;
reader.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) { swiping = false; return; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); swiping = true;
}, { passive: true });

reader.addEventListener("touchend", (e) => {
  if (!swiping) return;
  swiping = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  if (Date.now() - tt > 700) return;
  if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.7) return;
  go(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Escape" && document.body.classList.contains("sheet-open")) { closeSheet(); return; }
  if (e.key === "ArrowRight" || e.key === "l") go(1);
  else if (e.key === "ArrowLeft" || e.key === "h") go(-1);
  else if (e.key === "g") openSheet("passage");
  else if (e.key === "." ) toggleChrome();
});

$("#btn-passage").onclick = () => openSheet("passage");
$("#btn-trans").onclick   = () => openSheet("translations");
$("#btn-settings").onclick= () => openSheet("settings");
$("#btn-search").onclick  = () => openSheet("search");
$("#btn-prev").onclick    = () => go(-1);
$("#btn-next").onclick    = () => go(1);
$("#sheet-close").onclick = closeSheet;
$("#scrim").onclick       = closeSheet;
$("#sheet-back").onclick  = () => {
  if (sheetView === "passage" && pickedBook){ pickedBook = null; drawSheet(); }
  else openSheet("settings");
};
/* drag the sheet down to dismiss */
(() => {
  const sheet = $("#sheet");
  let y0 = null;
  sheet.addEventListener("touchstart", (e) => {
    if (!e.target.closest(".sheet-grip") && !e.target.closest(".sheet-head")) return;
    y0 = e.touches[0].clientY; sheet.style.transition = "none";
  }, { passive:true });
  sheet.addEventListener("touchmove", (e) => {
    if (y0 == null) return;
    const d = Math.max(0, e.touches[0].clientY - y0);
    sheet.style.transform = `translateY(${d}px)`;
  }, { passive:true });
  sheet.addEventListener("touchend", (e) => {
    if (y0 == null) return;
    const d = Math.max(0, e.changedTouches[0].clientY - y0);
    sheet.style.transition = ""; sheet.style.transform = "";
    y0 = null;
    if (d > 90) closeSheet();
  });
})();

/* ══════════════════════════════════════════════════════════════
   13 · Boot
   ══════════════════════════════════════════════════════════════ */
(async function boot(){
  const saved = await Store.get("settings");
  if (saved) Object.assign(S, saved);
  const pos = await Store.get("position");
  if (pos && byId[pos.book]) { S.book = pos.book; S.chapter = pos.chapter; }
  for (const k of (await Store.get("offline")) || []) offlineBooks.add(k);

  applyLook();
  syncChrome();
  if (S.awake) requestWake();

  showState(null);
  await open(S.book, S.chapter, { animate:false });
  showChrome();
})();

/* Repaint when the system flips, but only while the user has asked us to
   follow it. Sheet is redrawn too so the "dark right now" line stays true. */
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
  if (S.theme !== "auto") return;
  applyLook();
  if (document.body.classList.contains("sheet-open")) drawSheet();
});

/* ══════════════════════════════════════════════════════════════
   15 · Service worker — offline shell
   Registered last, and deliberately never awaited: a worker that
   fails to install must not keep the reader from opening.
   Needs a secure context, so this is inert over plain http:// on a
   LAN address (same constraint as Wake Lock) — https or localhost.
   ══════════════════════════════════════════════════════════════ */
if ("serviceWorker" in navigator && window.isSecureContext) {
  addEventListener("load", () => {
    /* Relative path, so scope follows the directory the app is served
       from: / locally, /vigil/ on Pages. */
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
