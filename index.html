<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vigil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Vigil</title>
<style>
/* ─────────────────────────────────────────────────────────────
   VIGIL — a dark room for reading scripture
   Palette:  dark  — void #000000 · ink (warm parchment, tunable)
             light — vellum ground · iron-gall ink, never #fff/#000
             gilt #9C7F4A · ash #2A2823 · dim (muted ink)
   Every colour below goes through a token. applyLook() writes all 20
   per theme; nothing here hardcodes a tone. Dark is the priority.
   Type:     Book (Iowan/Charter) · Modern (ui-serif) · Plain (ui-sans)
   Signature: gilt chapter numeral set as a drop cap, verse numbers
             hung in the margin, and chrome that dissolves to nothing.
   ───────────────────────────────────────────────────────────── */

*,*::before,*::after{box-sizing:border-box}
/* The DOCUMENT is the scroller, not an inner element. That is the whole
   reason the URL bar retracts on iOS Safari and Android Chrome: both tie
   the bar to the ROOT scroller, so a fixed shell wrapping an overflow:auto
   child opts the page out of it entirely — no meta tag or script can buy it
   back. Everything that was absolute inside #app is fixed to the viewport
   instead, and the edge fades are overlays rather than a mask on the
   scroller. Do not reintroduce overflow:hidden here. */
html,body{margin:0;padding:0;background:var(--void)}
body{
  min-height:100svh;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  /* Still none, and now it matters more: on the root scroller this is what
     stops Android's pull-to-refresh firing when you drag up at the top of a
     chapter. It does not affect the URL bar, which follows ordinary scroll. */
  overscroll-behavior:none;
}

:root{
  --void:#000;
  --ink:#b6ab98;
  --ink-dim:#6a6358;
  --ink-faint:#3d3931;
  --gilt:#9c7f4a;
  --gilt-dim:#5c4a2b;
  --ash:#211f1b;

  /* Surface tokens. Every panel tone in the sheets goes through these so a
     theme is a set of values, not a second stylesheet. Dark values here are
     the originals; applyLook() overwrites all of them per theme. */
  --surface:#0b0a09;      /* inset: tracks, wells, unselected controls      */
  --surface-hi:#151310;   /* the same surface, pressed                      */
  --wash:#17150f;         /* gold-tinted: a selected segment                */
  --wash-hi:#20190e;      /* gold-tinted: a switch that is on               */
  --wash-soft:#100e0a;    /* gold-tinted, quieter: the chapter you are on   */
  --line:#1c1a16;         /* control borders                                */
  --line-hi:#221f1a;      /* the one border that sits a shade brighter      */
  --line-soft:#131210;    /* row dividers                                   */
  --track:#2b2822;        /* the hairline a slider thumb runs along         */
  --press:#0f0e0c;        /* a chrome button held down                      */
  --scrim:rgba(0,0,0,.72);/* behind an open sheet                           */
  --woc:#a8624f;          /* words of Jesus                                 */
  --void-0:rgba(0,0,0,0); /* --void at zero alpha, for the chrome scrims    */

  --face: "Iowan Old Style","Palatino Linotype",Palatino,"Sitka Text",Charter,"Bitstream Charter",Cambria,Georgia,serif;
  --ui: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --fs:19px;
  --lh:1.68;
  --measure:34rem;
  /* 7vw is right on a phone and wrong the moment the column stops filling
     the window: #page is border-box and capped at --measure, so on a laptop
     a 100px gutter was eating the column from the inside — the wider the
     screen, the narrower the text. The cap is what stops that.

     32px, not 30: the cap has to sit ABOVE 7vw of the widest phone or it
     starts nudging the mobile layout it exists to leave alone. 7vw of a
     430pt iPhone Pro Max is 30.1px, which a 30px cap clipped — a tenth of
     a pixel, but enough to shift every glyph in the column. At 32 the
     rendering is byte-identical up to a 457pt viewport and the cap only
     ever bites on a tablet or a desktop. */
  --pad:min(7vw, 32px);

  /* One knob for larger screens, and it multiplies the type and the column
     TOGETHER so the measure stays at the characters-per-line it was tuned
     to. 1 on a phone: the mobile design does not move. */
  --zoom:1;

  --fade:520ms;
}
@media (prefers-reduced-motion: reduce){ :root{--fade:1ms} }

/* ── larger screens ───────────────────────────────────────── */
/* The phone is the design and the baseline; everything here is gated on a
   viewport a phone does not have. What grows is the reading column, not the
   layout — no second column, no panels, no sidebar. Two-column reading was
   considered and rejected: it fights the scroll-driven immersion logic and
   the edge fades, and a psalter is not a newspaper.

   Height is in every query as well as width. A 1440x700 browser window is
   wide but SHORT, and scaling type up there would cost lines of text on a
   screen that has few to give. Landscape is where this breaks down, which
   is why it is not a width-only breakpoint.

   iPad portrait (820x1180) lands on the first step at 1.08 — very close to
   the "probably needs nothing" it was predicted to need. That is deliberate. */
@media (min-width: 820px) and (min-height: 620px){ :root{--zoom:1.08} }
@media (min-width:1200px) and (min-height: 760px){ :root{--zoom:1.16} }
@media (min-width:1700px) and (min-height: 900px){ :root{--zoom:1.24} }

/* ── shell ────────────────────────────────────────────────── */
/* Height is stated explicitly rather than left to inset:0. This is good
   practice for a fixed iOS shell on its own merits, but note it did NOT
   demonstrably fix the bottom-gap issue it was written for — see "Open:
   the bottom gap" in CLAUDE.md. Do not treat it as the cure. */
#app{background:var(--void)}

#reader{
  /* pan-y only, so a horizontal drag reaches the chapter-turn handler
     instead of being eaten as a scroll. */
  touch-action:pan-y;
}

/* Text dissolves into the page at the top and bottom edges. This used to be
   a -webkit-mask-image on the scroller; as fixed overlays it is pinned to
   the VIEWPORT, so it no longer depends on the scroll box resolving its own
   height correctly — which is what the bottom-gap note called candidate 3. */
.fade{position:fixed;left:0;right:0;height:54px;z-index:2;pointer-events:none}
#fade-top{top:0;background:linear-gradient(to bottom,var(--void),var(--void-0))}
#fade-bot{bottom:0;background:linear-gradient(to top,var(--void),var(--void-0))}

#page{
  max-width:calc(var(--measure) * var(--zoom));
  margin:0 auto;
  /* The vertical rhythm is proportional on purpose — the bottom band is what
     lets the last verse rise to a comfortable reading height instead of
     sitting on the bezel — so it stays in vh and is only CAPPED. Both caps
     sit above what any phone produces (46vh of an 844pt iPhone is 388px), so
     they bite on a tall desktop or iPad and nowhere else. */
  padding:
    calc(env(safe-area-inset-top,0px) + min(20vh, 190px))
    var(--pad)
    calc(env(safe-area-inset-bottom,0px) + min(46vh, 440px));
  font-family:var(--face);
  font-size:calc(var(--fs) * var(--zoom));
  line-height:var(--lh);
  color:var(--ink);
  font-variant-numeric:oldstyle-numeral;
  text-rendering:optimizeLegibility;
  transition:opacity 260ms ease;
}
#page.turning{opacity:0}
body[data-face="modern"] #page{font-family:ui-serif,Charter,Georgia,"Times New Roman",serif}
body[data-face="plain"]  #page{font-family:var(--ui);letter-spacing:-.005em}

/* ── the text itself ──────────────────────────────────────── */
.ref-line{
  font-family:var(--ui);
  /* rem, not em, so it does NOT follow the Size slider — but it must follow
     --zoom, or the running head shrinks away as the column grows. Same for
     the colophon. */
  font-size:calc(.62rem * var(--zoom));
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--gilt-dim);
  margin:0 0 2.4em;
}
.hd{
  font-family:var(--face);
  font-size:.86em;
  font-weight:400;
  font-style:normal;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gilt);
  opacity:.82;
  margin:2.1em 0 .9em;
  line-height:1.45;
}
.hd:first-child{margin-top:0}
.sub{
  font-style:italic;
  color:var(--ink-dim);
  margin:0 0 1.2em;
  font-size:.92em;
}
.pg{margin:0 0 1.05em}
/* Without numerals or a drop cap, paragraphs need their own separation. */
#page.plain .pg{margin:0 0 1.35em}
#page.plain .pg:first-of-type{margin-top:0}
.pg + .pg{margin-top:0}
.poem{
  margin:0;
  padding-left:calc(var(--ind,1) * 1.35em);
  /* The hang is the width of the numeral that sits in it. Three characters
     -- "1", "12", "119" -- all fit .9em, which is what this was before The
     Message arrived merging its verses. A marker like "12-17" or "27-29a"
     needs more, or the line's first word starts inside the numeral. --vw is
     the marker's length in characters, set by the renderer. */
  text-indent:calc(var(--vw,3) * -.3em);
}
.poem + .pg{margin-top:1.05em}
.pg + .poem{margin-top:.4em}
.poem.last{margin-bottom:1.05em}
/* The hanging indent would otherwise swallow the drop cap's right margin
   and butt the first word against the numeral. Only the line carrying the
   cap opts out; the rest of the stanza keeps its hang. */
.poem.has-cap{text-indent:0}

/* The numerals are drawn from data-n by CSS rather than being text nodes,
   and that is a functional choice, not a stylistic one. Edge's Read Aloud —
   and any other "read this page to me" feature — extracts the page's TEXT.
   As text nodes the numbers are read out loud between every verse, which
   makes the chapter unlistenable: "one In the beginning two And the earth".
   Generated content is not part of innerText, so it is skipped.

   Measured 2026-08-27 in both Chrome and Edge, because the obvious fixes do
   not work: aria-hidden leaves the numeral in innerText (Read Aloud is not
   a screen reader and does not consult ARIA), and CSS `speak:never` is
   unimplemented everywhere. Generated content was the only lever that moved
   it. Screen readers still announce the numbers, because Chromium does
   expose pseudo-element text to the accessibility tree — which is the
   outcome we want: quiet for Read Aloud, intact for assistive tech.

   Keep data-v as well. It is what landOn() anchors to, and it is not
   interchangeable with data-n: on the drop cap, data-v is verse 1 while
   data-n is the CHAPTER number. */
.vn::before,.cap::before{content:attr(data-n)}
/* Drawn rather than written, so Read Aloud speaks the chapter and nothing
   else — see the read-aloud gotcha. */
.ref-line::before,.hd::before,.sub::before{content:attr(data-t)}
.close-mark::before{content:"\25c6"}
.colophon .cname::before,.colophon a::before,.colophon p::before{content:attr(data-t)}
.colophon .sep::before{content:"\00a0\00b7\00a0"}

.vn{
  font-family:var(--ui);
  font-size:.56em;
  font-variant-numeric:lining-nums;
  letter-spacing:.02em;
  color:var(--gilt);
  opacity:.72;
  vertical-align:.42em;
  /* 0, not .32em: the nbsp inside the span now supplies that gap. Measured
     at 3.30px against the old margin's 3.39px, so the spacing is unchanged
     to the eye. Restoring the margin here would double the gap. */
  margin-right:0;
  margin-left:.06em;
  user-select:none;
}
.pg > .vn:first-child,.poem > .vn:first-child{margin-left:0}
/* Hide the NUMERAL, keep the span. display:none would take the nbsp inside
   it with it, and afterMark has already suppressed the following run's
   leading space on the grounds that the numeral supplies the gap — so
   removing the span entirely fuses the verses: "the earth.The earth was".
   That was true before the numerals became generated content too; turning
   verse numbers off has always run them together. */
body[data-verses="off"] .vn::before{content:none}

.woc{color:var(--ink)}
body[data-woc="on"] .woc{color:var(--woc)}

/* signature: the gilt chapter numeral */
.cap{
  float:left;
  font-size:3.15em;
  line-height:.82;
  padding-top:.06em;
  margin:0 .14em -.04em 0;
  color:var(--gilt);
  font-variant-numeric:lining-nums;
  font-weight:400;
}
body[data-layout="verse"] .cap{display:none}

/* verse-per-line layout */
body[data-layout="verse"] .pg,
body[data-layout="verse"] .poem{
  margin:0 0 .62em;
  padding-left:0;
  text-indent:0;
}

.close-mark{
  margin:3.4em 0 0;
  text-align:center;
  color:var(--gilt);
  opacity:.35;
  font-size:.6em;
  letter-spacing:.6em;
}
.colophon{
  margin:2.6em 0 0;
  font-family:var(--ui);
  font-size:calc(.62rem * var(--zoom));
  line-height:1.7;
  letter-spacing:.06em;
  color:var(--ink-faint);
}
.colophon a{color:var(--ink-faint)}
/* an inline control that reads as part of the sentence around it */
.linkish{
  appearance:none;background:none;border:0;padding:0;
  font:inherit;color:var(--gilt);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;
}
.colophon p{margin:.85em 0 0}
.colophon p:first-of-type{margin-top:.45em}

/* ── chrome (dissolves) ───────────────────────────────────── */
.chrome{
  position:fixed;left:0;right:0;
  font-family:var(--ui);
  opacity:1;
  transition:opacity var(--fade) ease, transform var(--fade) ease;
  z-index:4;
}
/* The flex row lives one level in from .chrome so the gradient can stay
   full-bleed while the CONTROLS are railed to the text column on a wide
   screen — otherwise the title and the settings button end up flung to
   opposite corners of a 1920px window with the reading column stranded
   between them. Below the breakpoint .bar is a plain flex row and the bars
   are byte-for-byte what they were. */
.bar{display:flex;align-items:center;gap:2px}
#topbar{
  top:0;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 14px;
  background:linear-gradient(to bottom,var(--void) 42%,var(--void-0));
}
#botbar{
  bottom:0;
  padding:20px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:linear-gradient(to top,var(--void) 42%,var(--void-0));
}
body.immersive .chrome{opacity:0;pointer-events:none}
body.immersive #topbar{transform:translateY(-6px)}
body.immersive #botbar{transform:translateY(6px)}
@media (min-width:820px){
  /* --measure is a border-box width and already contains --pad, so the rail
     is the column, not the column plus its gutters. Getting that wrong put
     the title exactly one --pad to the left of the text it labels. */
  .bar{
    max-width:calc(var(--measure) * var(--zoom));
    margin:0 auto;
    /* .btn carries 11px of its own side padding; subtracting it lines the
       title's glyphs up with the first letter of the chapter rather than
       with the edge of its button box. */
    padding:0 max(0px, calc(var(--pad) - 11px));
  }
}

.btn{
  appearance:none;-webkit-appearance:none;
  background:none;border:0;
  color:var(--ink-dim);
  font:inherit;font-size:13px;
  letter-spacing:.04em;
  padding:9px 11px;
  border-radius:9px;
  cursor:pointer;
  white-space:nowrap;
  transition:color 160ms ease,background 160ms ease;
}
.btn:active{background:var(--press);color:var(--ink)}
.btn:focus-visible{outline:1.5px solid var(--gilt);outline-offset:1px}
.btn.tag{
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gilt-dim);
}
.btn.title{
  color:var(--ink);
  font-size:14px;
  letter-spacing:.02em;
}
.btn.title small{color:var(--gilt-dim);margin-left:.5em;font-size:9px;vertical-align:1px}
.btn[disabled]{opacity:.22;pointer-events:none}
.grow{flex:1}

/* reading progress hairline */
#progress{
  position:fixed;top:0;left:0;right:0;height:1px;
  z-index:6;pointer-events:none;
}
#progress i{
  display:block;height:100%;width:0;
  background:var(--gilt);
  opacity:.55;
  transition:opacity var(--fade) ease;
}
body.immersive #progress i{opacity:.16}

/* ── sheets ───────────────────────────────────────────────── */
#scrim{
  position:fixed;inset:0;z-index:8;
  touch-action:none;
  background:var(--scrim);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;
  transition:opacity 240ms ease;
}
body.sheet-open #scrim{opacity:1;pointer-events:auto}

#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  max-height:86%;
  display:flex;flex-direction:column;
  background:var(--void);
  border-top:1px solid var(--ash);
  border-radius:16px 16px 0 0;
  /* Three translates, composed, because two other things need to write to
     this transform without knowing about each other: --sx centres the sheet
     once it stops being full-width (a wide screen), and --drag is the
     drag-to-dismiss offset. The drag handler used to assign
     style.transform directly, which silently threw the centring away the
     first time a finger touched the grip on an iPad. Set the variable, not
     the property. */
  --sx:0px;
  transform:translateX(var(--sx)) translateY(101%) translateY(var(--drag,0px));
  transition:transform 300ms cubic-bezier(.22,.9,.28,1);
  font-family:var(--ui);
  color:var(--ink);
}
body.sheet-open #sheet{transform:translateX(var(--sx)) translateY(var(--drag,0px))}
/* A bottom sheet is still the right shape here — it keeps the reading
   column visible above it, and it is the same gesture on an iPad as on a
   phone. What is wrong on a wide screen is a 1920px-wide one, with two
   columns of book names a metre apart. So it narrows; it does not become a
   different component. */
@media (min-width:820px){
  #sheet{
    left:50%;right:auto;--sx:-50%;
    width:min(560px, 92vw);
    max-height:min(80vh, 780px);
  }
}
/* The document is the scroller, so an open sheet has to freeze it or the
   page scrolls behind the sheet. top is set in JS to the frozen offset. */
body.locked{position:fixed;left:0;right:0;width:100%}
@media (prefers-reduced-motion: reduce){#sheet{transition:none}}

.sheet-grip{
  flex:none;height:22px;display:grid;place-items:center;cursor:grab;
}
.sheet-grip::after{content:"";width:34px;height:3px;border-radius:2px;background:var(--ash)}
.sheet-head{
  flex:none;display:flex;align-items:center;gap:4px;
  padding:0 8px 8px;
}
.sheet-head h2{
  margin:0;flex:1;
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gilt-dim);font-weight:500;
  padding-left:8px;
}
.sheet-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 14px calc(env(safe-area-inset-bottom,0px) + 22px);
}

/* passage picker */
.seg{
  display:flex;gap:2px;padding:3px;margin:0 0 14px;
  background:var(--surface);border-radius:11px;
}
.seg button{
  flex:1;appearance:none;background:none;border:0;
  color:var(--ink-dim);font:inherit;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;
  padding:9px 4px;border-radius:9px;cursor:pointer;
}
.seg button[aria-selected="true"]{background:var(--wash);color:var(--gilt)}

/* Multi-column rather than grid. A column layout fills top-to-bottom and
   then moves right, which is the order a list of books is read in; grid's
   row-major flow put Exodus beside Genesis instead of beneath it. Multicol
   also needs nothing but a column count — a grid would need an explicit
   ceil(n / columns) row count, recomputed for each testament (39 vs 27)
   and again at every breakpoint. */
.books{column-count:2;column-gap:10px}
@media (min-width:560px){.books{column-count:3}}
.order-row{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.books button{
  appearance:none;background:none;border:0;text-align:left;
  color:var(--ink);font:inherit;font-size:15px;
  padding:11px 8px;border-radius:8px;cursor:pointer;
  display:flex;align-items:baseline;gap:.5em;
  width:100%;margin-bottom:1px;
  break-inside:avoid;-webkit-column-break-inside:avoid;
}
.books button b{font-weight:400;flex:1}
.books button span{font-size:10px;color:var(--ink-faint);letter-spacing:.08em}
.books button[aria-current="true"]{color:var(--gilt)}
.books button:active{background:var(--press)}

.chapters{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
@media (min-width:480px){.chapters{grid-template-columns:repeat(8,1fr)}}
.chapters button{
  appearance:none;background:var(--surface);border:1px solid transparent;
  color:var(--ink);font:inherit;font-size:14px;
  aspect-ratio:1;border-radius:9px;cursor:pointer;
  font-variant-numeric:lining-nums;
}
.chapters button:active{background:var(--surface-hi)}
.chapters button[aria-current="true"]{border-color:var(--gilt-dim);color:var(--gilt);background:var(--wash-soft)}

/* settings rows */
.row{
  display:flex;align-items:center;gap:12px;
  padding:15px 8px;
  border-bottom:1px solid var(--line-soft);
}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;font-size:14px;color:var(--ink)}
.row .lbl em{
  display:block;font-style:normal;font-size:11.5px;
  color:var(--ink-faint);margin-top:3px;line-height:1.45;
}
.group-title{
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gilt-dim);padding:22px 8px 6px;
}
.pillbtn{
  appearance:none;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);font:inherit;font-size:12.5px;
  padding:8px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;
}
.pillbtn:active{background:var(--surface-hi)}
.pillbtn.primary{border-color:var(--gilt-dim);color:var(--gilt)}
.pillbtn[disabled]{opacity:.35;pointer-events:none}

.steps{display:flex;gap:3px;background:var(--surface);padding:3px;border-radius:10px}
.steps button{
  appearance:none;background:none;border:0;color:var(--ink-dim);
  font:inherit;font-size:12px;padding:7px 11px;border-radius:8px;cursor:pointer;
}
.steps button[aria-selected="true"]{background:var(--wash);color:var(--gilt)}

input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:132px;height:24px;background:none;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--track)}
input[type=range]::-moz-range-track{height:1px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--gilt);margin-top:-7px;
}
input[type=range]::-moz-range-thumb{

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   1 · Storage — persists settings + last position + offline books
   ══════════════════════════════════════════════════════════════ */
const Store = (() => {
  const mem = new Map();
  const PREFIX = "vigil:";                 // the origin is shared with other Pages projects
  const isBook = k => k.startsWith("bk:"); // books go to IndexedDB; everything else is small

  /* localStorage — settings, last position, offline index.
     Safari in private mode has the object but throws on write, so probe it. */
  let ls = null;
  try {
    const t = PREFIX + "probe";
    localStorage.setItem(t, "1"); localStorage.removeItem(t);
    ls = localStorage;
  } catch (_) { ls = null; }

  /* IndexedDB — downloaded books, far too large for localStorage. */
  const DB = "vigil", TABLE = "books";
  let dbp = null;
  function openDB(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open(DB, 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains(TABLE)) d.createObjectStore(TABLE);
      };
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
      req.onblocked = () => rej(new Error("blocked"));
    }).catch(e => { dbp = null; throw e; });   // let a failed open be retried
    return dbp;
  }
  function tx(mode, fn){
    return openDB().then(d => new Promise((res, rej) => {
      const t = d.transaction(TABLE, mode);
      let out;
      t.oncomplete = () => res(out);
      t.onerror    = () => rej(t.error);
      t.onabort    = () => rej(t.error || new Error("aborted"));   // quota lands here
      const r = fn(t.objectStore(TABLE));
      if (r) r.onsuccess = () => { out = r.result; };
    }));
  }

  return {
    backed: !!ls,
    async get(key){
      if (mem.has(key)) return mem.get(key);
      let v = null;
      if (isBook(key)) {
        try { const r = await tx("readonly", s => s.get(key)); if (r != null) v = r; }
        catch (_) { return null; }                 // don't cache a miss we couldn't read
      } else if (ls) {
        try { const r = ls.getItem(PREFIX + key); if (r != null) v = JSON.parse(r); }
        catch (_) { v = null; }
      }
      mem.set(key, v);
      return v;
    },
    async set(key, value){
      mem.set(key, value);
      if (isBook(key)) {
        try { await tx("readwrite", s => s.put(value, key)); }
        catch (_) { return false; }                // out of quota, or no IndexedDB
      } else if (ls) {
        try { ls.setItem(PREFIX + key, JSON.stringify(value)); }
        catch (_) { return false; }
      }
      return true;
    },
    async del(key){
      mem.delete(key);
      if (isBook(key)) { try { await tx("readwrite", s => s.delete(key)); } catch (_) {} }
      else if (ls)     { try { ls.removeItem(PREFIX + key); } catch (_) {} }
    }
  };
})();

/* ══════════════════════════════════════════════════════════════
   2 · Canon — USFM ids + chapter counts (Protestant order)
   ══════════════════════════════════════════════════════════════ */
const BOOKS = [
  ["GEN","Genesis",50],["EXO","Exodus",40],["LEV","Leviticus",27],["NUM","Numbers",36],
  ["DEU","Deuteronomy",34],["JOS","Joshua",24],["JDG","Judges",21],["RUT","Ruth",4],
  ["1SA","1 Samuel",31],["2SA","2 Samuel",24],["1KI","1 Kings",22],["2KI","2 Kings",25],
  ["1CH","1 Chronicles",29],["2CH","2 Chronicles",36],["EZR","Ezra",10],["NEH","Nehemiah",13],
  ["EST","Esther",10],["JOB","Job",42],["PSA","Psalms",150],["PRO","Proverbs",31],
  ["ECC","Ecclesiastes",12],["SNG","Song of Solomon",8],["ISA","Isaiah",66],["JER","Jeremiah",52],
  ["LAM","Lamentations",5],["EZK","Ezekiel",48],["DAN","Daniel",12],["HOS","Hosea",14],
  ["JOL","Joel",3],["AMO","Amos",9],["OBA","Obadiah",1],["JON","Jonah",4],
  ["MIC","Micah",7],["NAM","Nahum",3],["HAB","Habakkuk",3],["ZEP","Zephaniah",3],
  ["HAG","Haggai",2],["ZEC","Zechariah",14],["MAL","Malachi",4],
  ["MAT","Matthew",28],["MRK","Mark",16],["LUK","Luke",24],["JHN","John",21],
  ["ACT","Acts",28],["ROM","Romans",16],["1CO","1 Corinthians",16],["2CO","2 Corinthians",13],
  ["GAL","Galatians",6],["EPH","Ephesians",6],["PHP","Philippians",4],["COL","Colossians",4],
  ["1TH","1 Thessalonians",5],["2TH","2 Thessalonians",3],["1TI","1 Timothy",6],["2TI","2 Timothy",4],
  ["TIT","Titus",3],["PHM","Philemon",1],["HEB","Hebrews",13],["JAS","James",5],
  ["1PE","1 Peter",5],["2PE","2 Peter",3],["1JN","1 John",5],["2JN","2 John",1],
  ["3JN","3 John",1],["JUD","Jude",1],["REV","Revelation",22]
].map(([id,name,chapters],i) => ({ id, name, chapters, ot: i < 39 }));

const byId = Object.fromEntries(BOOKS.map(b => [b.id, b]));
const OT_COUNT = 39;

function step(bookId, chapter, dir){
  const i = BOOKS.findIndex(b => b.id === bookId);
  if (i < 0) return null;
  let c = chapter + dir;
  if (c >= 1 && c <= BOOKS[i].chapters) return { book: bookId, chapter: c };
  const j = i + dir;
  if (j < 0 || j >= BOOKS.length) return null;
  return { book: BOOKS[j].id, chapter: dir > 0 ? 1 : BOOKS[j].chapters };
}

/* ══════════════════════════════════════════════════════════════
   3 · Sources — HelloAO (free, no key) and Crossway ESV (your key)
   ══════════════════════════════════════════════════════════════ */
const AO = "https://bible.helloao.org";
const ESV_ENDPOINT = "https://api.esv.org/v3/passage/text/";
const AB = "https://api.scripture.api.bible/v1";
/* API.Bible translations are prefixed so the source is readable off the
   id alone: "ab:6f11a7de016f942e-01". HelloAO ids stay bare, and the ESV
   stays the literal string it has always been. */
const AB_TAG = "ab:";
const isAB = tid => typeof tid === "string" && tid.startsWith(AB_TAG);
/* What the translation is CALLED on screen. HelloAO ids are already the
   abbreviation ("BSB"), and so is "ESV"; an API.Bible id is a 16-hex string,
   which is no kind of label. Every place that shows the translation goes
   through here -- the header tag and the reference line both leaked the raw
   id when they each rolled their own. */
const transLabel = () => isAB(S.translation) ? (S.abAbbr || "\u2014") : S.translation;
/* Their Fair Use Management System. Reporting a read is a condition of
   the licence, not analytics we chose -- see the API.Bible section of
   CLAUDE.md. */
const FUMS_ENDPOINT = "https://fums.api.bible/f3";
const ESV_SEARCH_ENDPOINT = "https://api.esv.org/v3/passage/search/";

/* Verbatim from api.esv.org's terms (checked 2026-08-27). Their API page
   carries a different notice from crossway.org/permissions/ -- no "ESV Text
   Edition" line, and the two restrictions follow "All rights reserved."
   rather than preceding it. The API page governs our use, so it wins.
   Do not paraphrase, reorder or trim this.

   This belongs on the COPYRIGHT group of the translation sheet, which is our
   "copyright page" -- not on the chapter colophon. Their terms ask for the
   full notice once per site; a page showing text needs only the letters
   "ESV" and a link to esv.org, which the colophon carries. The blank line
   is a paragraph break. */
const ESV_NOTICE =
  "Scripture quotations are from the ESV\u00ae Bible (The Holy Bible, English Standard Version\u00ae), \u00a9 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved. The ESV text may not be quoted in any publication made available to the public by a Creative Commons license. The ESV may not be translated into any other language."
  + "\n\n"
  + "Users may not copy or download more than 500 verses of the ESV Bible or more than one half of any book of the ESV Bible.";

/* A chapter is normalised to:
   { blocks: [ {kind:'heading'|'sub'|'p'|'poem', indent, runs:[{t,v,woc}]} ],
     credit: {name, note, url} }                                            */

function Builder(){
  const blocks = [];
  let cur = null;
  return {
    blocks,
    flush(){ if (cur && !cur.runs.length) blocks.pop(); cur = null; },
    heading(text){
      this.flush();
      if (text.trim()) blocks.push({ kind:"heading", text: text.trim() });
    },
    sub(text){
      this.flush();
      if (text.trim()) blocks.push({ kind:"sub", text: text.trim() });
    },
    add(text, verse, kind, indent, woc){
      if (text == null || text === "") { if (verse == null) return; text = ""; }
      indent = indent || 0;
      if (!cur || cur.kind !== kind || cur.indent !== indent){
        this.flush();
        cur = { kind, indent, runs: [] };
        blocks.push(cur);
      }
      cur.runs.push({ t: text, v: verse, woc: !!woc });
    },
    brk(){ if (cur) { const k = cur.kind, i = cur.indent; this.flush(); cur = { kind:k, indent:i, runs:[] }; blocks.push(cur); } }
  };
}

/* ── HelloAO ───────────────────────────────────────────────── */
async function fetchAO(translation, book, chapter){
  const res = await fetch(`${AO}/api/${encodeURIComponent(translation)}/${book}/${chapter}.json`);
  if (!res.ok) throw new Error(`${res.status}`);
  const data = await res.json();
  const b = Builder();
  let pending = null;   // verse number waiting to attach to its first run

  for (const item of (data.chapter && data.chapter.content) || []){
    if (item.type === "heading"){
      b.heading((item.content || []).join(" "));
    } else if (item.type === "line_break"){
      b.flush();
    } else if (item.type === "hebrew_subtitle"){
      b.sub((item.content || []).filter(x => typeof x === "string").join(" "));
    } else if (item.type === "verse"){
      pending = item.number;
      for (const part of item.content || []){
        if (typeof part === "string"){
          b.add(part, pending, "p", 0, false); pending = null;
        } else if (part && typeof part.text === "string"){
          const poem = typeof part.poem === "number";
          b.add(part.text, pending, poem ? "poem" : "p", poem ? part.poem : 0, part.wordsOfJesus);
          pending = null;
        } else if (part && part.lineBreak){
          b.brk();
        } else if (part && typeof part.heading === "string"){
          b.heading(part.heading);
        }
        /* footnote refs ({noteId}) are intentionally dropped */
      }
    }
  }
  b.flush();

  const t = data.translation || {};
  return {
    blocks: b.blocks,
    bookName: (data.book && data.book.commonName) || byId[book].name,
    chapters: (data.book && data.book.numberOfChapters) || byId[book].chapters,
    credit: { name: t.name || translation, note: t.licenseNotes || "Free-use text via HelloAO", url: t.website || null }
  };
}

/* ── Crossway ESV ──────────────────────────────────────────── */
async function fetchESV(key, book, chapter){
  const q = `${byId[book].name} ${chapter}`;
  const params = new URLSearchParams({
    q,
    "include-passage-references":"false",
    "include-verse-numbers":"true",
    "include-first-verse-numbers":"true",
    "include-footnotes":"false",
    "include-footnote-body":"false",
    "include-headings":"true",
    "include-short-copyright":"false",
    "include-copyright":"false",
    "include-passage-horizontal-lines":"false",
    "include-heading-horizontal-lines":"false",
    "indent-using":"space",
    "indent-paragraphs":"0",
    "indent-poetry":"true",
    "indent-poetry-lines":"2",
    "indent-declares":"0",
    "indent-psalm-doxology":"0",
    "line-length":"0"
  });
  const res = await fetch(`${ESV_ENDPOINT}?${params}`, {
    headers: { Authorization: `Token ${key.trim()}` }
  });
  if (res.status === 401 || res.status === 403) throw new Error("badkey");
  if (!res.ok) throw new Error(`${res.status}`);
  const data = await res.json();
  const raw = (data.passages && data.passages[0]) || "";
  if (!raw.trim()) throw new Error("empty");
  return { blocks: parseESV(raw), bookName: byId[book].name, chapters: byId[book].chapters,
           credit: { name:"English Standard Version (ESV)",
                     note:null,
                     url:"https://www.esv.org" } };
}

/* The ESV text endpoint returns one line per paragraph or poetry line,
   verse markers as [n], and poetry indented in multiples of two spaces. */
function parseESV(raw){
  const b = Builder();
  const text = raw.replace(/\s*\(ESV\)\s*$/,"");
  const lines = text.split("\n");
  let seenVerse = false;

  /* ESV's paragraph indent is a server-side setting and prose can arrive
     already indented, so a leading space alone does not mean poetry.
     Measure the shallowest verse-bearing line — but only trust it as the
     zero point when nothing sits DEEPER. A passage with deeper lines is
     poetry, and there the shallowest line is poetry too, not prose.
     Without that second test a psalm loses its first indent level: every
     level-1 line flattens to prose and only its continuations stay poetry,
     which renders Psalm 23 as alternating paragraph and verse blocks. */
  let base = Infinity, deepest = 0;
  for (const line of lines){
    if (!line.trim()) continue;
    const n = (line.match(/^ */) || [""])[0].length;
    if (n > deepest) deepest = n;
    if (/\[\d+(?::\d+)?\]/.test(line)) base = Math.min(base, n);
  }
  if (!isFinite(base)) base = 0;
  if (deepest > base) base = 0;        // poetry present: indents are absolute

  for (let i = 0; i < lines.length; i++){
    const line = lines[i];
    if (!line.trim()) { b.flush(); continue; }

    /* A heading stands alone between blank lines; a line of poetry never
       does. That, not indentation, is what separates them — ESV sets the
       Hebrew letters of Psalm 119 at the SAME indent as the poetry they
       head, so an indent test loses 22 of that psalm's 23 headings. */
    const framed = (i === 0 || !lines[i-1].trim()) &&
                   (i === lines.length - 1 || !lines[i+1].trim());

    const body = line.trim();
    /* ESV keeps the verse marker in the margin and pushes a deeper poetic
       line out with spaces AFTER it, so the indent of a verse's opening
       line lives there rather than in the leading whitespace. Only the
       marker that STARTS the line counts; mid-line markers in prose are
       followed by an ordinary single space. */
    const pad = /^\[\d+(?::\d+)?\]( +)/.exec(body);
    const inner = pad ? pad[1].length - 1 : 0;
    const lead = Math.max(0, (line.match(/^ */) || [""])[0].length - base) + inner;
    const indent = Math.min(3, Math.round(lead / 2));
    const hasVerse = /\[\d+(?::\d+)?\]/.test(body);

    if (!hasVerse){
      if (!seenVerse && /[.!?]["'\u201d\u2019]?$/.test(body)) { b.sub(body); continue; }
      if (framed && body.length < 74 && !/[.,;:!?\u201d\u2019"']$/.test(body)) { b.heading(body); continue; }
    }

    const parts = body.split(/\[(\d+(?::\d+)?)\]/);
    let verse = null;
    for (let i = 0; i < parts.length; i++){
      if (i % 2 === 1){
        const m = parts[i].split(":");
        verse = parseInt(m[m.length - 1], 10);
        seenVerse = true;
      } else {
        const chunk = parts[i].replace(/\s+/g," ").trim();
        if (!chunk && verse == null) continue;
        b.add(chunk, verse, indent ? "poem" : "p", indent, false);
        verse = null;
      }
    }
  }
  b.flush();
  return b.blocks;
}

/* ── API.Bible ─────────────────────────────────────────────── */

/* FUMS -- their Fair Use Management System. Every chapter read has to be
   reported back, and that is a licence condition rather than a choice: it
   is how the American Bible Society accounts to Biblica, NavPress and the
   rest for texts it does not itself own.

   We take the manual URL rather than their fumsV3.min.js, deliberately.
   Vigil is one file with no third-party script in it, and a CDN script is
   behaviour that can change without a deploy of ours. This sends exactly
   what the endpoint asks for and nothing else -- and only for API.Bible
   chapters. The ESV and HelloAO paths report nothing, as they always have.

   The device id is random and carries no identity: it exists so a
   publisher can tell one reader reading fifty chapters from fifty readers
   reading one, which is the number they are owed. */
const fumsSession = Math.random().toString(36).slice(2, 12);
function fumsDevice(){
  if (!S.abDev){ S.abDev = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); save(); }
  return S.abDev;
}
function reportFums(token){
  if (!token) return;
  const u = `${FUMS_ENDPOINT}?t=${encodeURIComponent(token)}`
          + `&dId=${encodeURIComponent(fumsDevice())}`
          + `&sId=${encodeURIComponent(fumsSession)}`;
  /* no-cors: we neither need nor can read the response, and a failed report
     must never take a chapter down with it. */
  fetch(u, { mode:"no-cors", keepalive:true }).catch(() => {});
}

/* Their chapters arrive as USX-in-JSON: a flat list of `para` tags, each
   carrying the USFM style that says what the paragraph IS. Structure comes
   as data rather than as indentation to be measured, which is why this
   parser is a fraction of the size of parseESV. */
function abPara(style){
  if (!style) return { kind:"p", indent:0 };
  if (style === "b") return { kind:"break" };
  if (style === "d" || style === "sp") return { kind:"sub" };
  /* Parallel-passage references are apparatus, not scripture, and Vigil
     drops apparatus -- footnotes already go. */
  if (style === "r" || style === "sr" || style === "rem") return { kind:"skip" };
  if (/^(?:ms|mt|s)\d*$/.test(style)) return { kind:"heading" };
  /* `qa` is an ACROSTIC heading, not poetry -- the Hebrew letter standing
     over each stanza of Psalm 119. It begins with q and would otherwise
     fall through to the poetry branch and be read as a line of the psalm.
     The ESV parser hit the same trap from the other direction; both now
     agree that these are headings. `qd` is the closing musical direction. */
  if (style === "qa") return { kind:"heading" };
  if (style === "qd") return { kind:"sub" };
  if (/^q/.test(style)){
    const m = /(\d)/.exec(style);
    return { kind:"poem", indent: m ? +m[1] : 1 };
  }
  return { kind:"p", indent:0 };
}

/* Heading text only. A verse tag's items hold the NUMERAL, which must never
   be read as words, and notes are dropped whole. */
function abText(items, out){
  for (const it of items || []){
    if (it.type === "text"){ if (it.text) out.push(it.text); }
    else if (it.type === "tag" && it.name !== "note" && it.name !== "verse") abText(it.items, out);
  }
  return out;
}

function abBody(items, b, ctx){
  for (const it of items || []){
    if (it.type === "text"){
      if (it.text){
        /* The NLT opens every Psalm 119 line with a whitespace-only text
           node BEFORE the verse tag. Emitted, it becomes a stray run that
           indents the line by a space. Drop whitespace arriving before
           anything else in the paragraph. */
        if (ctx.atStart && !/\S/.test(it.text)) continue;
        /* A run carrying a verse marker must not also carry a leading
           space. The numeral already contributes an nbsp, and the renderer
           only suppresses a space it would have ADDED -- one already inside
           the text survives and doubles the gap. Seen live on John 3:27. */
        const t = ctx.pending != null ? it.text.replace(/^\s+/, "") : it.text;
        if (t){ b.add(t, ctx.pending, ctx.kind, ctx.indent, ctx.woc); ctx.pending = null; ctx.atStart = false; }
      }
      continue;
    }
    if (it.type !== "tag") continue;
    if (it.name === "note") continue;
    if (it.name === "verse"){
      /* The Message merges verses, so this is "1-2" or even "29b" as often
         as it is "7". It stays a STRING the whole way to the numeral. */
      const n = it.attrs && it.attrs.number;
      if (n != null && n !== "") ctx.pending = String(n);
      continue;
    }
    if (it.name === "char"){
      const st = it.attrs && it.attrs.style;
      const was = ctx.woc;
      if (st === "wj") ctx.woc = true;
      abBody(it.items, b, ctx);
      ctx.woc = was;
      continue;
    }
    abBody(it.items, b, ctx);
  }
}

function parseAB(content){
  const b = Builder();
  const ctx = { pending:null, kind:"p", indent:0, woc:false, atStart:true };
  for (const item of content || []){
    if (!item || item.type !== "tag" || item.name !== "para") continue;
    const p = abPara((item.attrs || {}).style);
    if (p.kind === "skip") continue;
    if (p.kind === "break"){ b.flush(); continue; }
    if (p.kind === "heading"){ b.heading(abText(item.items, []).join("")); continue; }
    if (p.kind === "sub"){ b.sub(abText(item.items, []).join("")); continue; }
    ctx.kind = p.kind; ctx.indent = p.indent; ctx.atStart = true;
    abBody(item.items, b, ctx);
    /* One para is one block. Without this, consecutive q1 lines merge into
       a single run of poetry and the stanza loses its line breaks. */
    b.flush();
  }
  b.flush();
  return b.blocks;
}

/* Per-Bible metadata -- name, abbreviation, and the publisher's own link,
   which their terms require on the page showing the text. It changes about
   never, so it is fetched once and kept; caching metadata is explicitly
   encouraged, and every call saved matters against 5,000 a MONTH. */
const abMetaCache = new Map();
async function abMeta(key, id){
  if (abMetaCache.has(id)) return abMetaCache.get(id);
  const stored = await Store.get(`abm:${id}`);
  if (stored){ abMetaCache.set(id, stored); return stored; }
  const res = await fetch(`${AB}/bibles/${encodeURIComponent(id)}`, {
    headers: { "api-key": key.trim() }
  });
  if (!res.ok) throw new Error(`${res.status}`);
  const d = (await res.json()).data || {};
  /* `info` is a scrap of HTML: "<p>For more information, visit
     https://www.navpress.com/</p>". The link inside it is the IP holder's,
     which is the one the terms ask for. */
  const m = /https?:\/\/[^\s"'<>)]+/.exec(d.info || "");
  const meta = {
    id,
    name: d.name || id,
    abbr: d.abbreviationLocal || d.abbreviation || "",
    copyright: d.copyright || null,
    url: m ? m[0].replace(/[.,]$/, "") : null
  };
  abMetaCache.set(id, meta);
  Store.set(`abm:${id}`, meta);
  return meta;
}

async function fetchAB(key, bibleId, book, chapter){
  const params = new URLSearchParams({
    "content-type":"json",
    "include-notes":"false",
    "include-titles":"true",
    "include-chapter-numbers":"false",
    "include-verse-numbers":"true",
    "include-verse-spans":"false",
    "fums-version":"3"
  });
  const res = await fetch(
    `${AB}/bibles/${encodeURIComponent(bibleId)}/chapters/${book}.${chapter}?${params}`,
    { headers: { "api-key": key.trim() } });
  if (res.status === 401 || res.status === 403) throw new Error("badkey");
  if (!res.ok) throw new Error(`${res.status}`);
  const payload = await res.json();
  const data = payload.data || {};
  reportFums(payload.meta && payload.meta.fumsToken);

  const blocks = parseAB(data.content);
  if (!blocks.length) throw new Error("empty");

  let meta = abMetaCache.get(bibleId);
  if (!meta){ try { meta = await abMeta(key, bibleId); } catch (_){ meta = null; } }

  return {
    blocks,
    bookName: byId[book].name,
    chapters: byId[book].chapters,
    credit: {
      name: meta ? (meta.abbr ? `${meta.name} (${meta.abbr})` : meta.name) : bibleId,
      note: data.copyright || (meta && meta.copyright) || null,
      url: meta && meta.url,
      /* The Starter tier requires a visible citation and hyperlink to
         api.bible itself, on top of the publisher's own. */
      via: { name:"API.Bible", url:"https://api.bible" }
    }
  };
}
