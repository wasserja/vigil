/* ══════════════════════════════════════════════════════════════
   4 · State
   ══════════════════════════════════════════════════════════════ */
const S = {
  translation: "BSB",
  translationName: "Berean Standard Bible",
  esvKey: "",
  abKey: "",
  abAbbr: "",
  abDev: "",
  book: "JHN",
  chapter: 1,
  theme: "dark",
  bookOrder: "canon",
  lum: 68, warm: 9,
  fs: 19, lh: 1.68, measure: 34,
  face: "book", verses: "on", layout: "para", woc: "off",
  awake: false, autohide: true,
  rate: 0.95, voice: "", listen: false
};

const chapterCache = new Map();          // "TID/BOOK/CH" -> normalised chapter
const offlineBooks = new Set();          // "TID/BOOK" already downloaded
let translations = null;                 // lazily fetched list
let wakeLock = null;

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

/* ══════════════════════════════════════════════════════════════
   5 · Appearance
   ══════════════════════════════════════════════════════════════ */
/* Resolve "auto" against the system. Dark is the fallback everywhere, so a
   browser with no prefers-color-scheme support stays on the OLED design. */
function effectiveTheme(){
  if (S.theme === "light") return "light";
  if (S.theme === "auto")
    return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  return "dark";
}

function applyLook(){
  const r = document.documentElement.style;
  const L = S.lum, W = S.warm;
  const light = effectiveTheme() === "light";

  if (!light){
    /* ── Dark: the point of the app. Pure black ground, warm parchment ink
       lifted off it by L. Untouched from the original. ───────────────── */
    r.setProperty("--void",      "#000");
    r.setProperty("--void-0",    "rgba(0,0,0,0)");
    r.setProperty("--ink",       `hsl(38 ${W}% ${L}%)`);
    r.setProperty("--ink-dim",   `hsl(38 ${Math.round(W*0.8)}% ${Math.round(L*0.62)}%)`);
    r.setProperty("--ink-faint", `hsl(38 ${Math.round(W*0.7)}% ${Math.round(L*0.38)}%)`);
    r.setProperty("--gilt",      `hsl(41 ${34 + Math.round(W*0.5)}% ${Math.round(L*0.74)}%)`);
    r.setProperty("--gilt-dim",  `hsl(41 ${28 + Math.round(W*0.4)}% ${Math.round(L*0.46)}%)`);
    r.setProperty("--ash",       `hsl(40 8% ${Math.max(9, Math.round(L*0.18))}%)`);
    r.setProperty("--surface",   "#0b0a09");
    r.setProperty("--surface-hi","#151310");
    r.setProperty("--wash",      "#17150f");
    r.setProperty("--wash-hi",   "#20190e");
    r.setProperty("--wash-soft", "#100e0a");
    r.setProperty("--line",      "#1c1a16");
    r.setProperty("--line-hi",   "#221f1a");
    r.setProperty("--line-soft", "#131210");
    r.setProperty("--track",     "#2b2822");
    r.setProperty("--press",     "#0f0e0c");
    r.setProperty("--scrim",     "rgba(0,0,0,.72)");
    r.setProperty("--woc",       "#a8624f");
  } else {
    /* ── Light: vellum, not white. The counterpart to the candle-lit
       psalter is the same manuscript read by daylight — so the ground is
       a warm off-white and the ink is iron-gall brown-black, never #fff
       and never #000.

       L is re-pointed rather than reused. In the dark it says how far the
       INK lifts off the page; here it says how much light the PAGE gives
       off, so dialling it down still means "less light in the room" and
       the control keeps its meaning instead of inverting under you. The
       ceiling is 97%, not 100%: a pure-white page at night is the thing
       this app exists to avoid. W still means warmth, tinting both the
       ground and the ink toward candle. ──────────────────────────────── */
    const P  = Math.round(84 + (L - 46) * 13 / 42);   /* 46..88 -> 84..97 */
    const sat = (n) => Math.round(n * 10) / 10;
    /* W*0.9, not the W*0.55 you would expect from parity with the dark
       palette: a light ground perceptually desaturates, so matching the
       numbers makes vellum read as grey. This keeps Warmth meaning the
       same thing to the eye in both themes. */
    r.setProperty("--void",      `hsl(40 ${sat(W*0.9)}% ${P}%)`);
    r.setProperty("--void-0",    `hsl(40 ${sat(W*0.9)}% ${P}% / 0)`);
    r.setProperty("--ink",       `hsl(34 ${sat(12 + W*0.7)}% 18%)`);
    r.setProperty("--ink-dim",   `hsl(34 ${sat(10 + W*0.5)}% 40%)`);
    r.setProperty("--ink-faint", `hsl(34 ${sat(8 + W*0.4)}% 52%)`);
    r.setProperty("--gilt",      "hsl(38 66% 28%)");
    r.setProperty("--gilt-dim",  "hsl(38 48% 38%)");
    r.setProperty("--ash",       `hsl(40 12% ${P-11}%)`);
    r.setProperty("--surface",   `hsl(40 ${sat(W*0.8)}% ${P-4}%)`);
    r.setProperty("--surface-hi",`hsl(40 ${sat(W*0.8)}% ${P-9}%)`);
    r.setProperty("--wash",      `hsl(42 40% ${P-7}%)`);
    r.setProperty("--wash-hi",   `hsl(42 52% ${P-11}%)`);
    r.setProperty("--wash-soft", `hsl(42 30% ${P-5}%)`);
    r.setProperty("--line",      `hsl(40 10% ${P-14}%)`);
    r.setProperty("--line-hi",   `hsl(40 10% ${P-19}%)`);
    r.setProperty("--line-soft", `hsl(40 10% ${P-7}%)`);
    r.setProperty("--track",     `hsl(40 10% ${P-18}%)`);
    r.setProperty("--press",     `hsl(40 ${sat(W*0.8)}% ${P-12}%)`);
    r.setProperty("--scrim",     "rgba(28,24,17,.34)");
    r.setProperty("--woc",       "#8f3f2c");
  }

  document.body.dataset.theme = light ? "light" : "dark";
  /* Safari and Android chrome tint their UI from this. iOS reads the
     status-bar meta once at launch and cannot be re-pointed later, which
     is a known limit — see the note in CLAUDE.md. */
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute("content",
    light ? getComputedStyle(document.documentElement).getPropertyValue("--void").trim() || "#eae4d8"
          : "#000000");

  r.setProperty("--fs", S.fs + "px");
  r.setProperty("--lh", S.lh);
  r.setProperty("--measure", S.measure + "rem");
  document.body.dataset.face   = S.face;
  document.body.dataset.verses = S.verses;
  document.body.dataset.layout = S.layout;
  document.body.dataset.woc    = S.woc;
}

/* ══════════════════════════════════════════════════════════════
   6 · Rendering
   ══════════════════════════════════════════════════════════════ */
function renderChapter(ch){
  const page = $("#page");
  page.innerHTML = "";

  /* Listening layout: emit ONLY the prose. Everything decorative is left
     out entirely rather than emptied — an empty <h2> or an orphan fragment
     is exactly what makes a reader view misbehave (it once promoted the
     word "it." to the page title). What is left is ordinary paragraphs of
     text, which every extractor and read-aloud engine handles correctly. */
  const plain = listenView;
  page.classList.toggle("plain", plain);

  /* data-t, not a text node: see the read-aloud gotcha. This line is
     metadata, and it carries a U+00B7 that speech engines pronounce "dot". */
  if (!plain){
  const ref = el("p","ref-line");
  ref.dataset.t = `${ch.bookName} ${S.chapter} · ${transLabel()}`;
  /* Belt and braces. Generated content keeps this out of the page's TEXT,
     which is what desktop Read Aloud extracts — but Chromium DOES expose
     ::before content to the accessibility tree, and a reader built on that
     tree speaks the U+00B7 as "dot" regardless. aria-hidden closes the
     second path. Nothing is lost: the chrome already names the chapter, so
     a screen reader is not denied anything it cannot get elsewhere. */
  ref.setAttribute("aria-hidden", "true");
  page.appendChild(ref);
  }

  const blocks = S.layout === "verse" ? toVerseLines(ch.blocks) : ch.blocks;
  let capUsed = false;
  /* Carried across blocks: a verse of poetry spans several of them, and the
     continuation lines have no marker of their own. */
  let curV = null;

  blocks.forEach((blk, i) => {
    /* Headings and Hebrew subtitles are editorial, not scripture, and are
       drawn from data-t so read-aloud does not interrupt the chapter with
       them. Same mechanism as the verse numerals. */
    if (blk.kind === "heading"){
      if (plain) return;                    // editorial, and not to be spoken
      const h = el("h2","hd"); h.dataset.t = blk.text; page.appendChild(h); return;
    }
    if (blk.kind === "sub"){
      if (plain) return;
      const b = el("p","sub"); b.dataset.t = blk.text; page.appendChild(b); return;
    }

    const p = el("p", blk.kind === "poem" ? "pg poem" : "pg");
    if (blk.kind === "poem"){
      p.style.setProperty("--ind", String(Math.max(1, blk.indent || 1)));
      const nxt = blocks[i+1];
      if (!nxt || nxt.kind !== "poem") p.classList.add("last");
    }

    let first = true;
    let tail = "";          // last text written, so spacing stays single
    let afterMark = false;  // a verse number or the numeral already supplies the gap

    for (const run of blk.runs){
      if (run.v != null){
        curV = run.v;
        if (plain){
          /* No marker at all — just the word space that keeps two verses
             from fusing. A plain space, not an nbsp: there is no numeral
             here to be orphaned at a line end. */
          if (p.childNodes.length) p.appendChild(document.createTextNode(" "));
          afterMark = true;
        } else if (first && !capUsed && S.layout !== "verse"){
          const cap = el("span","cap");
          cap.dataset.v = String(run.v);        // the numeral stands in for verse 1's number
          cap.dataset.n = String(S.chapter);    // drawn by CSS, not a text node — see .cap::before
          p.appendChild(cap);
          p.classList.add("has-cap");
          capUsed = true;
        } else {
          const vn = el("span","vn");
          vn.dataset.v = String(run.v);
          vn.dataset.n = String(run.v);         // drawn by CSS, not a text node — see .vn::before
          /* A NON-BREAKING space, so two verses sharing a paragraph do not
             fuse in the text layer — "the LORDAnd he said". The numeral is
             generated content and contributes no text of its own, and
             afterMark suppresses the following run's leading space because
             the numeral supplies the gap visually; speech needs the break
             even though the eye does not.

             It has to be U+00A0 rather than a plain space for two reasons:
             a plain space adds a line-break opportunity immediately after
             the numeral, which lets a verse number be orphaned at the end
             of a line; and it collapses, so the gap would depend on where
             the line broke. The nbsp binds the numeral to the first word of
             its verse, which is what you want anyway. Its width replaces
             .vn's old margin-right — see the note there. */
          /* Only when something precedes it. The nbsp exists to keep two
             verses in one paragraph from fusing in the text layer; first in
             a paragraph there is nothing to separate, and emitting it there
             shows up as a stray leading space wherever the numeral itself
             is dropped — visible in Edge's reader view. */
          if (p.childNodes.length) vn.textContent = "\u00a0";
          /* A merged marker -- "12-17", "27-29a" -- is wider than the .9em
             the hanging indent was cut for, and only the numeral that OPENS
             a poetry line sits in that hang. Hand its length to the CSS. */
          if (blk.kind === "poem" && !p.childNodes.length){
            const w = String(run.v).length;
            if (w > 3) p.style.setProperty("--vw", String(w));
          }
          p.appendChild(vn);
        }
        afterMark = true;
      }
      if (run.t){
        const needsSpace = !afterMark && tail && !/[\s\u201c(]$/.test(tail) && !/^[\s.,;:!?)\u201d\u2019]/.test(run.t);
        const piece = (needsSpace ? " " : "") + run.t;
        /* Wrap the TEXT of each verse — not the numeral, not the drop cap —
           so read-aloud can highlight exactly the verse being spoken. In
           paragraph layout a .pg holds many verses, so highlighting the
           paragraph would light up most of the screen. Leaving .vn and .cap
           as direct children keeps `.pg > .vn:first-child` and the cap's
           float working untouched; a bare inline span costs no layout. */
        let host = p;
        if (curV != null){
          let vt = p.lastElementChild;
          if (!vt || !vt.classList.contains("vt") || vt.dataset.vt !== String(curV)){
            vt = el("span","vt"); vt.dataset.vt = String(curV); p.appendChild(vt);
          }
          host = vt;
        }
        /* Merge into the previous span when nothing distinguishes them.
           A source may split one verse across several runs for reasons that
           leave no trace in the output — BSB puts a footnote marker inside
           John 1:5, and we drop the marker — and the leftover seam is a real
           liability: Edge's reader view treated the orphaned "it." as the
           page's title. One run of prose should be one text node. */
        const prev = host.lastElementChild;
        const sameKind = prev && prev.tagName === "SPAN" && !prev.classList.contains("vn")
                         && prev.className === (run.woc ? "woc" : "");
        if (sameKind) prev.textContent += piece;
        else {
          const t = el("span", run.woc ? "woc" : null);
          t.textContent = piece;
          host.appendChild(t);
        }
        tail = run.t;
        afterMark = false;
      }
      first = false;
    }
    if (p.childNodes.length) page.appendChild(p);
  });

  if (!plain){
    const closeMark = el("div","close-mark");   // glyph drawn in CSS, see .close-mark::before
    closeMark.setAttribute("aria-hidden", "true");   // pure ornament
    page.appendChild(closeMark);
  }

  const col = el("div","colophon");
  /* The separator is only earned when something follows it. */
  /* The whole colophon is drawn from data-t rather than written, so that
     read-aloud stops at the last verse instead of reciting the licence. It
     is still displayed, and safely so: Vigil's stylesheet is INLINE in this
     file, so there is no separate stylesheet that could fail and leave a
     required notice unshown. The link keeps a real href and gains an
     aria-label, so it is a genuine link with a genuine accessible name
     even though its visible text is generated. */
  const cname = el("span","cname"); cname.dataset.t = ch.credit.name;
  col.appendChild(cname);
  /* One link for most sources; API.Bible's Starter terms want the
     publisher's AND a visible citation to api.bible, so this takes a list. */
  for (const link of [ch.credit.url, ch.credit.via && ch.credit.via.url].filter(Boolean)){
    const sep = el("span","sep");
    sep.setAttribute("aria-hidden", "true");   // decorative punctuation, and a spoken "dot"
    col.appendChild(sep);
    const label = link.replace(/^https?:\/\//,"").replace(/\/$/,"");
    const a = el("a");
    a.dataset.t = label;
    a.setAttribute("aria-label", label);
    a.href = link; a.target = "_blank"; a.rel = "noopener";
    col.appendChild(a);
  }
  if (ch.credit.note) ch.credit.note.split(/\n{2,}/).forEach(para => {
    const n = el("p"); n.dataset.t = para; col.appendChild(n);
  });
  page.appendChild(col);

  window.scrollTo(0, 0);
  updateProgress();
}

function toVerseLines(blocks){
  const out = [];
  let cur = null;
  for (const blk of blocks){
    if (blk.kind === "heading" || blk.kind === "sub"){ out.push(blk); cur = null; continue; }
    for (const run of blk.runs){
      if (run.v != null || !cur){ cur = { kind:"p", indent:0, runs:[] }; out.push(cur); }
      cur.runs.push(run);
    }
  }
  return out.filter(b => b.kind !== "p" || b.runs.length);
}

function showState(title, body, action){
  const page = $("#page");
  page.innerHTML = "";
  const box = el("div","state");
  if (title === null){ box.appendChild(el("div","spin")); }
  else {
    box.appendChild(el("h3", null, title));
    if (body) box.appendChild(el("p", null, body));
    if (action){
      const btn = el("button","pillbtn primary", action.label);
      btn.onclick = action.run;
      box.appendChild(btn);
    }
  }
  page.appendChild(box);
  showChrome();
}

/* ══════════════════════════════════════════════════════════════
   7 · Loading
   ══════════════════════════════════════════════════════════════ */
async function getChapter(book, chapter){
  const key = `${S.translation}/${book}/${chapter}`;
  if (chapterCache.has(key)) return chapterCache.get(key);

  const saved = await Store.get(`bk:${S.translation}:${book}`);
  if (saved && saved[chapter]){
    for (const [c, v] of Object.entries(saved)) chapterCache.set(`${S.translation}/${book}/${c}`, v);
    offlineBooks.add(`${S.translation}/${book}`);
    return saved[chapter];
  }

  const data = S.translation === "ESV"
    ? await fetchESV(S.esvKey, book, chapter)
    : isAB(S.translation)
      ? await fetchAB(S.abKey, S.translation.slice(AB_TAG.length), book, chapter)
      : await fetchAO(S.translation, book, chapter);
  chapterCache.set(key, data);
  return data;
}

let loadToken = 0;
async function open(book, chapter, { animate = true, verse = null } = {}){
  /* A chapter change we did not initiate means the listener moved: the
     queue is about to be stale, so stop rather than read the wrong text.
     speakAdvance sets Speech.expect so its own move survives this. */
  if (Speech.on && Speech.expect !== `${book}/${chapter}`) speakStop();
  if (!byId[book]) { book = "JHN"; chapter = 1; }   // never let a bad id reach state
  const mine = ++loadToken;
  S.book = book; S.chapter = chapter;
  syncChrome();

  if (isAB(S.translation) && !S.abKey){
    showState("An API.Bible key is needed", "This is licensed text, so it can only be read live from API.Bible with your own key.",
      { label:"Add key", run:() => openSheet("translations") });
    return;
  }
  if (S.translation === "ESV" && !S.esvKey){
    showState("An ESV key is needed", "The ESV is licensed text, so it can only be read live from Crossway's API with your own key.",
      { label:"Add key", run:() => openSheet("translations") });
    return;
  }

  const page = $("#page");
  if (animate) page.classList.add("turning");

  let data;
  try {
    data = await getChapter(book, chapter);
  } catch (err){
    if (mine !== loadToken) return;
    page.classList.remove("turning");
    if (String(err.message) === "badkey"){
      showState("That key was refused", "Crossway returned 401. Check the key, and make sure the application is approved at api.esv.org.",
        { label:"Edit key", run:() => openSheet("translations") });
    } else if (`${S.translation}/${book}/${chapter}` === `${S.translation}/PSA/23` || (book === "PSA" && chapter === 23)){
      renderChapter(SAMPLE.data);
      toast("Offline — showing the bundled sample");
    } else {
      showState("No connection to the text", "The reader couldn't reach the translation server. Try again, or read Psalm 23 from the copy bundled in this file.",
        { label:"Try again", run:() => open(book, chapter) });
    }
    return;
  }
  if (mine !== loadToken) return;

  if (data.chapters && byId[book]) byId[book].chapters = data.chapters;
  renderChapter(data);
  page.classList.remove("turning");
  if (verse != null) landOn(verse);
  syncChrome();
  save();
  prefetchNeighbours(book, chapter);
}

/* Scroll a verse into view and let it glow once, so an arrival from search
   does not dump you at the top of a chapter to hunt for the line. */
function landOn(verse){
  const mark = $(`#page [data-v="${verse}"]`);
  if (!mark) return;
  /* a third of the way down reads better than dead-centre: the verse keeps
     the lines that lead into it. offsetTop is no use now that #page is in
     normal flow — measure against the viewport and add the page offset. */
  const top = mark.getBoundingClientRect().top + window.scrollY - window.innerHeight / 3;
  window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
  const line = mark.closest(".pg") || mark;
  line.classList.add("landed");
  setTimeout(() => line.classList.remove("landed"), 1600);
}

function prefetchNeighbours(book, chapter){
  for (const dir of [1, -1]){
    const n = step(book, chapter, dir);
    if (!n) continue;
    const key = `${S.translation}/${n.book}/${n.chapter}`;
    if (chapterCache.has(key)) continue;
    (S.translation === "ESV"
      ? (S.esvKey ? fetchESV(S.esvKey, n.book, n.chapter) : Promise.reject())
      : isAB(S.translation)
        ? (S.abKey ? fetchAB(S.abKey, S.translation.slice(AB_TAG.length), n.book, n.chapter) : Promise.reject())
        : fetchAO(S.translation, n.book, n.chapter)
    ).then(d => chapterCache.set(key, d)).catch(() => {});
  }
}

function go(dir){
  const n = step(S.book, S.chapter, dir);
  if (n) open(n.book, n.chapter);
}

/* ══════════════════════════════════════════════════════════════
   7b · Search — over the books you have saved for offline reading

   HelloAO has no search endpoint, so the corpus is what is already on
   the device. That is the honest constraint, not a limitation to
   apologise for: it works with no signal, which is when this app is
   used, and it never sends a query anywhere.

   The ESV cannot join that corpus — its text may not be stored — so it
   is searched at Crossway instead, on their own endpoint. Same sheet,
   same rows, different engine; see "ESV search" further down.

   No inverted index. A linear scan over the flattened corpus costs one
   toLowerCase per verse, which is a few tens of milliseconds even for a
   whole Bible, and it avoids a second persisted structure that would
   have to be rebuilt whenever a book is added or removed.
   ══════════════════════════════════════════════════════════════ */
const canonOrder = Object.fromEntries(BOOKS.map((b, i) => [b.id, i]));
let corpusCache = new Map();            // tid -> [{b,c,v,t}], built on demand

function flattenChapter(ch, bookId, chapterNo, out){
  let v = null, buf = "";
  const flush = () => {
    if (v == null) return;
    const t = buf.replace(/\s+/g, " ").trim();
    if (t) out.push({ b: bookId, c: chapterNo, v, t });
  };
  for (const blk of ch.blocks || []){
    if (!blk.runs) continue;            // headings and Hebrew subtitles are not verses
    for (const run of blk.runs){
      if (run.v != null){ flush(); v = run.v; buf = ""; }
      if (run.t) buf += " " + run.t;
    }
  }
  flush();
}

async function buildCorpus(tid, onProgress){
  if (corpusCache.has(tid)) return corpusCache.get(tid);
  const ids = [...offlineBooks]
    .filter(k => k.startsWith(tid + "/"))
    .map(k => k.slice(tid.length + 1))
    .sort((a, b) => canonOrder[a] - canonOrder[b]);
  const out = [];
  let done = 0;
  for (const bookId of ids){
    const data = await Store.get(`bk:${tid}:${bookId}`);
    if (data){
      for (const c of Object.keys(data).map(Number).sort((a, b) => a - b))
        flattenChapter(data[c], bookId, c, out);
    }
    if (onProgress) onProgress(++done, ids.length);
  }
  corpusCache.set(tid, out);
  return out;
}

/* A quoted query is a phrase; anything else is an AND over its words. */
function parseQuery(q){
  const phrase = /^\s*"(.+)"\s*$/.exec(q);
  if (phrase) return { phrase: phrase[1].toLowerCase().trim() };
  const terms = q.toLowerCase().split(/[^\p{L}\p{N}'\u2019]+/u).filter(Boolean);
  return { terms };
}

const SEARCH_CAP = 300;
function runSearch(corpus, q){
  const parsed = parseQuery(q);
  const hits = [];
  let total = 0;
  for (const r of corpus){
    const n = r.t.toLowerCase();
    const ok = parsed.phrase ? n.includes(parsed.phrase)
                             : parsed.terms.every(w => n.includes(w));
    if (!ok) continue;
    total++;
    if (hits.length < SEARCH_CAP) hits.push(r);
  }
  return { hits, total, parsed };
}

/* Build the verse text as nodes, with matches wrapped — never innerHTML,
   because scripture is not ours to inject markup into. */
function highlight(text, parsed){
  const frag = document.createDocumentFragment();
  const needles = (parsed.phrase ? [parsed.phrase] : parsed.terms)
    .filter(Boolean).sort((a, b) => b.length - a.length);
  if (!needles.length){ frag.appendChild(document.createTextNode(text)); return frag; }
  const low = text.toLowerCase();
  let i = 0;
  while (i < text.length){
    let at = -1, len = 0;
    for (const w of needles){
      const j = low.indexOf(w, i);
      if (j !== -1 && (at === -1 || j < at)){ at = j; len = w.length; }
    }
    if (at === -1){ frag.appendChild(document.createTextNode(text.slice(i))); break; }
    if (at > i) frag.appendChild(document.createTextNode(text.slice(i, at)));
    const m = el("span","hit"); m.textContent = text.slice(at, at + len);
    frag.appendChild(m);
    i = at + len;
  }
  return frag;
}

/* ── ESV search ─────────────────────────────────────────────────
   Crossway has a search endpoint, so the ESV is the one translation that
   can be searched without being stored. It searches the WHOLE Bible,
   where the offline engine only sees what you downloaded — but it costs a
   network round-trip and the query leaves the device, so the two are not
   silently interchangeable and the sheet says which one is running.

   Matching is close enough to ours to reuse parseQuery/highlight: bare
   words are ANDed, a "quoted phrase" is a phrase. Results come back in
   canonical order, 100 to a page.                                       */

/* Their references are display strings, not structured, so they have to be
   parsed back into a book id to be tappable. Two traps, both confirmed
   against 2,949 distinct references from the live endpoint:
     · Psalms comes back as the singular "Psalm 3:2".
     · Single-chapter books drop the chapter — "Jude 1" is book and VERSE,
       not book and chapter. So the short form is only accepted for books
       that actually have one chapter, or every "Jude 1" would open Jude
       chapter 1 with no verse and every "3 John 1" would be wrong. */
const esvBookByName = (() => {
  const m = Object.fromEntries(BOOKS.map(b => [b.name, b.id]));
  m["Psalm"] = "PSA";
  return m;
})();

function refFromESV(ref){
  let m = /^(.*?) (\d+):(\d+)$/.exec(ref);
  if (m && esvBookByName[m[1]]) return { b: esvBookByName[m[1]], c: +m[2], v: +m[3] };
  m = /^(.*?) (\d+)$/.exec(ref);
  const id = m && esvBookByName[m[1]];
  if (id && byId[id].chapters === 1) return { b: id, c: 1, v: +m[2] };
  return null;
}

const ESV_PAGE_SIZE = 100;                // their maximum

async function searchESV(key, q, page){
  const params = new URLSearchParams({ q, "page-size": ESV_PAGE_SIZE, page });
  const res = await fetch(`${ESV_SEARCH_ENDPOINT}?${params}`, {
    headers: { Authorization: `Token ${key.trim()}` }
  });
  if (res.status === 401 || res.status === 403) throw new Error("badkey");
  if (!res.ok) throw new Error(`${res.status}`);
  const d = await res.json();
  const hits = [];
  for (const r of d.results || []){
    const ref = refFromESV(r.reference);
    /* An unparseable reference would render a row that opens nothing, so
       drop it. Nothing in the sample needed this; it is a floor, not a path. */
    if (ref) hits.push({ ...ref, t: (r.content || "").replace(/\s+/g, " ").trim() });
  }
  return { hits, total: d.total_results || 0, page: d.page || page, pages: d.total_pages || 1 };
}

/* ══════════════════════════════════════════════════════════════
   7c · Read aloud
   ══════════════════════════════════════════════════════════════
   Browsers' own read-aloud features are not an option here. iOS Safari
   has none at all, and every iOS browser is forced onto WebKit, so
   Edge's desktop Read Aloud is a different implementation there that
   never managed this page. Since the installed app on a phone is where
   Vigil is actually read, the app speaks for itself.

   Speaking our own text also means we choose what is said: the queue is
   built from the chapter DATA, not the DOM, so headings, verse numerals
   and the colophon are absent by construction rather than by suppression.
   flattenChapter already yields exactly the verse text.

   One utterance per verse, not one per chapter. Long utterances get
   truncated or dropped by several engines, and per-verse granularity is
   what lets the current verse be highlighted and followed.            */

const Speech = { on:false, queue:[], i:0, held:false, seq:0, expect:null };
const speechOK = () => typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";

let voicesCache = [];
function loadVoices(){ try { voicesCache = speechSynthesis.getVoices() || []; } catch (_){ voicesCache = []; } }
function englishVoices(){ return voicesCache.filter(v => /^en\b|^en[-_]/i.test(v.lang)); }
function pickVoice(){
  if (!voicesCache.length) loadVoices();
  const en = englishVoices();
  if (S.voice){ const hit = voicesCache.find(v => v.voiceURI === S.voice); if (hit) return hit; }
  /* a local voice avoids a network round trip mid-sentence */
  return en.find(v => v.localService) || en[0] || null;
}

function verseQueue(){
  const ch = chapterCache.get(`${S.translation}/${S.book}/${S.chapter}`);
  if (!ch) return [];
  const out = [];
  flattenChapter(ch, S.book, S.chapter, out);   // verse text only: no headings, no numerals
  return out;
}

function markSpeaking(v){
  for (const e of document.querySelectorAll("#page .speaking")) e.classList.remove("speaking");
  const parts = document.querySelectorAll(`#page .vt[data-vt="${v}"]`);
  if (!parts.length) return;
  for (const e of parts) e.classList.add("speaking");
  /* Follow the reading, but only once it has left a comfortable band —
     re-centring on every verse makes the page twitch. */
  const r = parts[0].getBoundingClientRect();
  if (r.top < innerHeight * 0.16 || r.bottom > innerHeight * 0.74)
    window.scrollTo({ top: Math.max(0, r.top + window.scrollY - innerHeight / 3), behavior:"smooth" });
}

/* Walk the rendered verse and record where each text node begins, so a
   character offset from a boundary event can be turned back into a DOM
   position. Speaking THIS string rather than the queue's copy is what keeps
   the two in step — the queue text is normalised, the DOM text is not. */
function verseTextMap(v){
  const parts = document.querySelectorAll(`#page .vt[data-vt="${v}"]`);
  if (!parts.length) return null;
  const nodes = [];
  let text = "";
  for (const part of parts){
    /* A verse of poetry is several .vt elements in several paragraphs, and
       there is no whitespace text node between two <p>s — concatenating
       them raw gives "shepherd;I shall not want", which the engine then
       says that way too. The separator is added to the string only; the
       next node's recorded start already accounts for it, and a word never
       begins on it, so the offset mapping stays exact. */
    if (text && !/\s$/.test(text)) text += " ";
    const walk = document.createTreeWalker(part, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = walk.nextNode())){
      nodes.push({ node: n, start: text.length });
      text += n.nodeValue;
    }
  }
  return nodes.length ? { text, nodes } : null;
}

const wordHL = (typeof Highlight !== "undefined" && typeof CSS !== "undefined" && CSS.highlights)
  ? new Highlight() : null;
if (wordHL) CSS.highlights.set("vigil-word", wordHL);

function clearWord(){ if (wordHL) wordHL.clear(); }

/* Highlight one word by Range. No DOM mutation: wrapping words in spans
   mid-utterance would invalidate the offsets the boundary events are
   still counting against. */
function markWord(map, from){
  if (!wordHL || !map) return;
  const m = /^\s*(\S+)/.exec(map.text.slice(from));
  if (!m) { wordHL.clear(); return; }
  const a = from + m[0].length - m[1].length;
  const b = a + m[1].length;
  const at = (off) => {
    for (let i = map.nodes.length - 1; i >= 0; i--){
      const n = map.nodes[i];
      if (off >= n.start) return [n.node, Math.min(off - n.start, n.node.nodeValue.length)];
    }
    return [map.nodes[0].node, 0];
  };
  try {
    const r = document.createRange();
    r.setStart(...at(a));
    r.setEnd(...at(b));
    wordHL.clear();
    wordHL.add(r);
  } catch (_){ wordHL.clear(); }
}

function speakNext(){
  if (!Speech.on) return;
  if (Speech.i >= Speech.queue.length) return speakAdvance();
  const item = Speech.queue[Speech.i];
  /* Speak the rendered text when we can see it, so boundary offsets line
     up with the DOM; fall back to the queue's copy otherwise. */
  const map = verseTextMap(item.v);
  const u = new SpeechSynthesisUtterance(map ? map.text : item.t);
  u.rate = S.rate;
  const v = pickVoice(); if (v){ u.voice = v; u.lang = v.lang; }
  /* Not every engine fires these — iOS Safari historically does not, and
     network voices often skip them — so word following is a bonus on top of
     the verse highlight, never the only feedback. */
  u.onboundary = (e) => {
    if (!Speech.on || e.name === "sentence") return;
    markWord(map, e.charIndex || 0);
  };
  u.onend = () => { clearWord(); if (Speech.on){ Speech.i++; speakNext(); } };
  u.onerror = (e) => {
    /* cancel() raises these; they are not failures. */
    if (!Speech.on || e.error === "interrupted" || e.error === "canceled") return;
    speakStop(); toast("The voice stopped unexpectedly");
  };
  markSpeaking(item.v);
  clearWord();
  speechSynthesis.speak(u);
}

/* Roll into the next chapter, so listening does not stop every few minutes. */
async function speakAdvance(){
  /* Claim the sequence FIRST. open() is awaited, so a Stop — or a fresh
     Listen — can land while this is in flight; every exit below has to
     check, not just the success path. Without that, a stale advance's
     failure calls speakStop() and silently kills the session the user
     just started. */
  const mine = ++Speech.seq;
  const stale = () => mine !== Speech.seq;

  const n = step(S.book, S.chapter, 1);
  if (!n){ if (!stale()) speakStop(); return; }   // end of the canon
  Speech.expect = `${n.book}/${n.chapter}`;       // tells open() this move was ours

  let ok = true;
  try { await open(n.book, n.chapter); } catch (_){ ok = false; }
  if (stale()) return;
  Speech.expect = null;
  if (!ok){ speakStop(); toast("Couldn't load the next chapter"); return; }
  if (!Speech.on) return;

  Speech.queue = verseQueue();
  Speech.i = 0;
  if (!Speech.queue.length){ speakStop(); return; }
  speakNext();
}

function speakStart(){
  if (!speechOK()) return toast("This browser can't read aloud");
  const q = verseQueue();
  if (!q.length) return toast("Nothing to read here yet");
  Speech.on = true; Speech.queue = q; Speech.i = 0; Speech.seq++;
  if (!S.awake){ Speech.held = true; requestWake(); }
  try { speechSynthesis.cancel(); } catch (_){}
  speakNext();
  syncSpeakBtn();
}

function speakStop(){
  Speech.on = false; Speech.seq++; Speech.expect = null;
  clearWord();
  try { speechSynthesis.cancel(); } catch (_){}
  for (const e of document.querySelectorAll("#page .speaking")) e.classList.remove("speaking");
  if (Speech.held){ Speech.held = false; if (!S.awake) releaseWake(); }
  syncSpeakBtn();
}

function speakToggle(){ Speech.on ? speakStop() : speakStart(); }

function syncSpeakBtn(){
  const b = $("#btn-speak");
  if (!b) return;
  b.textContent = Speech.on ? "Stop" : "Listen";
  b.setAttribute("aria-pressed", String(Speech.on));
}

/* ══════════════════════════════════════════════════════════════
   8 · Chrome + immersion
   ══════════════════════════════════════════════════════════════ */
let hideTimer = null;

function showChrome(){
  document.body.classList.remove("immersive");
  clearTimeout(hideTimer);
  if (S.autohide && !document.body.classList.contains("sheet-open")){
    hideTimer = setTimeout(hideChrome, 2800);
  }
}
function hideChrome(){
  if (document.body.classList.contains("sheet-open")) return;
  clearTimeout(hideTimer);
  document.body.classList.add("immersive");
}
function toggleChrome(){
  document.body.classList.contains("immersive") ? showChrome() : hideChrome();
}

function syncChrome(){
  const name = (byId[S.book] || {}).name || S.book;
  $("#btn-passage").innerHTML = "";
  $("#btn-passage").append(document.createTextNode(`${name} ${S.chapter} `), Object.assign(document.createElement("small"), { textContent:"▾" }));
  $("#btn-trans").textContent = transLabel();

  for (const [id, dir] of [["#btn-prev",-1],["#btn-next",1]]){
    const n = step(S.book, S.chapter, dir);
    const btn = $(id);
    btn.disabled = !n;
    btn.querySelector("span").textContent = n ? `${(byId[n.book]||{}).name} ${n.chapter}` : "";
  }
}

function updateProgress(){
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const pct = max > 8 ? Math.min(1, window.scrollY / max) : 0;
  $("#progress i").style.width = (pct * 100).toFixed(2) + "%";
}

/* ══════════════════════════════════════════════════════════════
   9 · Sheets
   ══════════════════════════════════════════════════════════════ */
let sheetView = null;
/* Listening layout. Separate from S.listen because ?listen in the URL turns
   it on for THAT page load only — a bookmark you can open straight into a
   read-aloud browser without changing how the app opens next time. */
let listenView = false;
/* The ESV key form is shown on demand once a key exists — see
   drawTranslations. Reset whenever the sheet closes. */
let esvKeyOpen = false;
let abKeyOpen = false;
let abBibles = null;          // lazily fetched, deduped list for the key
/* Which build the offline shell is actually serving — see the About row. */
let swVersion = null;
function askWorkerVersion(){
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.ready.then(reg => {
    const w = navigator.serviceWorker.controller || reg.active;
    if (!w) return;
    /* A MessageChannel, not a bare postMessage: until the worker claims
       this page there is no controller, and the worker's reply would have
       nowhere to go. */
    const ch = new MessageChannel();
    ch.port1.onmessage = e => {
      if (!e.data || !e.data.vigilVersion) return;
      swVersion = e.data.vigilVersion;
      if (sheetView === "settings") drawSheet();
    };
    w.postMessage("version", [ch.port2]);
  }).catch(() => {});
}
let pickedBook = null;

/* Freezing has to preserve the offset by hand: position:fixed on the body
   otherwise snaps the page to the top, and restoring it is what stops the
   reader jumping when a sheet closes. */
let lockedY = 0;
function lockScroll(){
  lockedY = window.scrollY;
  document.body.style.top = `-${lockedY}px`;
  document.body.classList.add("locked");
}
function unlockScroll(){
  if (!document.body.classList.contains("locked")) return;
  document.body.classList.remove("locked");
  document.body.style.top = "";
  window.scrollTo(0, lockedY);
}

function openSheet(view){
  sheetView = view;
  lockScroll();
  document.body.classList.add("sheet-open");
  showChrome();
  clearTimeout(hideTimer);
  drawSheet();
}
function closeSheet(){
  esvKeyOpen = false; abKeyOpen = false;
  document.body.classList.remove("sheet-open");
  unlockScroll();
  sheetView = null; pickedBook = null;
  showChrome();
}

function drawSheet(){
  const body = $("#sheet-body");
  const back = $("#sheet-back");
  body.innerHTML = "";
  back.hidden = true;

  if (sheetView === "passage"){
    $("#sheet-title").textContent = pickedBook ? (byId[pickedBook].name) : "Passage";
    if (pickedBook){ back.hidden = false; drawChapters(body); }
    else drawBooks(body);
  } else if (sheetView === "settings"){
    $("#sheet-title").textContent = "Reading";
    drawSettings(body);
  } else if (sheetView === "translations"){
    $("#sheet-title").textContent = "Translation";
    drawTranslations(body);
  } else if (sheetView === "search"){
    $("#sheet-title").textContent = "Search";
    drawSearch(body);
  }
}

let testament = null;
function drawBooks(body){
  if (testament === null) testament = byId[S.book] && byId[S.book].ot ? "ot" : "nt";

  const seg = el("div","seg");
  for (const [k, label] of [["ot","Old Testament"],["nt","New Testament"]]){
    const b = el("button", null, label);
    b.setAttribute("aria-selected", String(testament === k));
    b.onclick = () => { testament = k; drawSheet(); };
    seg.appendChild(b);
  }
  body.appendChild(seg);

  const orderRow = el("div","order-row");
  const ord = el("div","steps");
  for (const [k, label] of [["canon","Canon"],["alpha","A\u2013Z"]]){
    const b = el("button", null, label);
    b.setAttribute("aria-selected", String(S.bookOrder === k));
    b.onclick = () => { S.bookOrder = k; save(); drawSheet(); };
    ord.appendChild(b);
  }
  orderRow.appendChild(ord);
  body.appendChild(orderRow);

  /* filter() already copies, so sorting here never disturbs BOOKS itself —
     canon order is derived from that array and must stay intact. */
  const shown = BOOKS.filter(b => (testament === "ot") === b.ot);
  if (S.bookOrder === "alpha")
    shown.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric:true }));

  const grid = el("div","books");
  for (const bk of shown){
    const b = el("button");
    b.append(el("b", null, bk.name), el("span", null, String(bk.chapters)));
    if (bk.id === S.book) b.setAttribute("aria-current","true");
    b.onclick = () => {
      if (bk.chapters === 1){ closeSheet(); open(bk.id, 1); return; }
      pickedBook = bk.id; drawSheet(); body.scrollTop = 0;
    };
    grid.appendChild(b);
  }
  body.appendChild(grid);
}

function drawChapters(body){
  const grid = el("div","chapters");
  const bookId = pickedBook;           // closeSheet() clears pickedBook, so hold it here
  const bk = byId[bookId];
  for (let c = 1; c <= bk.chapters; c++){
    const b = el("button", null, String(c));
    if (bookId === S.book && c === S.chapter) b.setAttribute("aria-current","true");
    b.onclick = () => { closeSheet(); open(bookId, c); };
    grid.appendChild(b);
  }
  body.appendChild(grid);
}

function drawSettings(body){
  const add = (n) => body.appendChild(n);
  const group = (t) => add(el("div","group-title", t));

  const row = (label, hint, control) => {
    const r = el("div","row");
    const l = el("div","lbl", label);
    if (hint) l.appendChild(Object.assign(document.createElement("em"), { textContent: hint }));
    r.append(l, control);
    add(r);
    return r;
  };

  const steps = (options, current, onPick) => {
    const wrap = el("div","steps");
    for (const [val, label] of options){
      const b = el("button", null, label);
      b.setAttribute("aria-selected", String(current === val));
      b.onclick = () => { onPick(val); applyLook(); redrawKeepScroll(); drawSheet(); save(); };
      wrap.appendChild(b);
    }
    return wrap;
  };

  const slider = (min, max, stepSize, value, onInput) => {
    const i = document.createElement("input");
    i.type = "range"; i.min = min; i.max = max; i.step = stepSize; i.value = value;
    i.oninput = () => { onInput(parseFloat(i.value)); applyLook(); updateProgress(); };
    i.onchange = save;
    return i;
  };

  const toggle = (checked, onChange) => {
    const t = el("button","switch");
    t.setAttribute("role","switch");
    t.setAttribute("aria-checked", String(checked));
    t.onclick = () => { onChange(!(t.getAttribute("aria-checked") === "true")); drawSheet(); save(); };
    return t;
  };

  group("Light");
  row("Theme", S.theme === "auto"
        ? `Following the system — ${effectiveTheme() === "light" ? "light" : "dark"} right now.`
        : "Dark is pure black, for an OLED screen at night.",
      steps([["dark","Dark"],["light","Light"],["auto","Auto"]], S.theme,
            v => S.theme = v));
  row("Brightness",
      effectiveTheme() === "light"
        ? "How much light the page gives off."
        : "How far the text lifts off the black.",
      slider(46, 88, 1, S.lum, v => S.lum = v));
  row("Warmth", "Pulls the ink from cool grey toward candlelight.", slider(0, 26, 1, S.warm, v => S.warm = v));

  group("Type");
  row("Size", null, slider(15, 30, 1, S.fs, v => S.fs = v));
  row("Line height", null, steps([[1.5,"Tight"],[1.68,"Normal"],[1.92,"Airy"]], S.lh, v => S.lh = v));
  row("Column", null, steps([[26,"Narrow"],[34,"Medium"],[44,"Wide"]], S.measure, v => S.measure = v));
  row("Face", null, steps([["book","Book"],["modern","Modern"],["plain","Plain"]], S.face, v => S.face = v));

  group("Page");
  row("Verse numbers", null, steps([["on","Show"],["off","Hide"]], S.verses, v => S.verses = v));
  row("Layout", "Flowing paragraphs, or one verse per line.", steps([["para","Paragraph"],["verse","Verse"]], S.layout, v => S.layout = v));
  row("Words of Jesus", "Tint them a muted red.", steps([["off","Off"],["on","On"]], S.woc, v => S.woc = v));

  group("Reading");
  row("Hide controls automatically", "Or keep the bars up until you tap.",
      toggle(S.autohide, v => { S.autohide = v; v ? showChrome() : (clearTimeout(hideTimer), document.body.classList.remove("immersive")); }));
  row("Keep the screen awake", "Stops the display dimming mid-chapter.",
      toggle(S.awake, v => { S.awake = v; v ? requestWake() : releaseWake(); }));

  group("Read aloud");
  row("Listening layout",
      "Drops the chapter numeral, verse numbers and headings, leaving plain "
      + "paragraphs. Use it when a browser's own read-aloud or reader view "
      + "will be doing the reading.",
      toggle(listenView, v => {
        S.listen = v; listenView = v;
        redrawKeepScroll();
      }));

  if (speechOK()){
    row("Speed", "Scripture wants a slower voice than a web page.",
        slider(0.6, 1.3, 0.05, S.rate, v => S.rate = v));
    const voices = englishVoices();
    if (voices.length){
      const sel = document.createElement("select");
      sel.className = "vselect";
      for (const v of voices){
        const o = document.createElement("option");
        o.value = v.voiceURI; o.textContent = v.name;
        if (v.voiceURI === S.voice) o.selected = true;
        sel.appendChild(o);
      }
      if (!S.voice){ const cur = pickVoice(); if (cur) sel.value = cur.voiceURI; }
      sel.onchange = () => { S.voice = sel.value; save(); };
      row("Voice", null, sel);
    }
  }

  group("About");
  const ab = el("div","row");
  ab.append(Object.assign(el("div","lbl", swVersion ? `Build ${swVersion}` : "Build unknown"), {}));
  ab.querySelector(".lbl").appendChild(Object.assign(document.createElement("em"), {
    textContent: !("serviceWorker" in navigator) || !window.isSecureContext
      ? "Not installed here — the offline shell needs https or localhost."
      : (swVersion ? "Vigil updates on the next launch after a release. Update now to skip the wait."
                   : "Waiting for the offline shell to answer.")
  }));
  const up = el("button","pillbtn","Update now");
  up.disabled = !("serviceWorker" in navigator) || !window.isSecureContext;
  up.onclick = async () => {
    up.disabled = true; up.textContent = "Checking\u2026";
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (!reg){ toast("Nothing installed here"); up.disabled = false; up.textContent = "Update now"; return; }
      await reg.update();
      /* The worker skipWaiting()s and claims on install, so a new build is
         already live by now — but THIS page still holds the old HTML, which
         is the whole reason the button exists. Reload into it. */
      setTimeout(() => location.reload(), 900);
    } catch (_){
      toast("Couldn't reach the update"); up.disabled = false; up.textContent = "Update now";
    }
  };
  add(ab); ab.appendChild(up);

  group("Translation");
  const tr = el("div","row");
  tr.append(el("div","lbl", S.translationName || transLabel()));
  const chg = el("button","pillbtn","Change");
  chg.onclick = () => openSheet("translations");
  tr.appendChild(chg);
  add(tr);

  group("Offline");
  const bk = byId[S.book];
  const dl = el("div","row");
  const lbl = el("div","lbl", `${bk.name} \u00b7 ${bk.chapters} chapter${bk.chapters>1?"s":""}`);
  const stored = offlineBooks.has(`${S.translation}/${S.book}`);
  lbl.appendChild(Object.assign(document.createElement("em"), {
    textContent: S.translation === "ESV"
      ? "The ESV licence doesn't allow storing a local copy — it stays live."
      /* API.Bible's terms DO allow a copy, provided it is refreshed at
         least every 30 days. That expiry isn't built yet, so the button
         stays off rather than quietly keeping text past its licence. */
      : isAB(S.translation)
        ? "This translation stays live for now — a saved copy would have to expire every 30 days, and that isn't built yet."
        : (stored ? "Saved on this device." : "Save every chapter of this book for reading without a signal.")
  }));
  const dlBtn = el("button", "pillbtn" + (stored ? "" : " primary"), stored ? "Remove" : "Download");
  dlBtn.disabled = S.translation === "ESV" || isAB(S.translation);
  dlBtn.onclick = () => stored ? removeBook(dlBtn) : downloadBook(dlBtn);
  dl.append(lbl, dlBtn);
  add(dl);

  if (!Store.backed){
    add(Object.assign(el("div","note"), { textContent:"Storage isn't available here, so settings and downloads last only for this session. Hosted on your own domain, they persist." }));
  }
}

let searchQ = "";                 // survives a redraw, so the field keeps its text
let searchSeq = 0;                // guards against a slow corpus build landing late

/* ESV results are module-level for the same reason searchQ is: reopening the
   sheet should show what you already spent a query on, not silently spend
   another one. */
let esvSearch = { q:"", hits:[], total:0, page:0, pages:0 };

/* One result row, shared by both engines so they cannot drift apart. */
function resultRow(h, parsed){
  const b = el("button");
  b.appendChild(el("span","rref", `${byId[h.b].name} ${h.c}:${h.v}`));
  b.appendChild(highlight(h.t, parsed));
  /* Capture before closing: closeSheet() tears down sheet state, and
     arguments evaluate after it runs. */
  const bk = h.b, ch = h.c, vs = h.v;
  b.onclick = () => { closeSheet(); open(bk, ch, { verse: vs }); };
  return b;
}

function drawSearch(body){
  const isESV = S.translation === "ESV";
  const wrap = el("div");
  const input = document.createElement("input");
  input.type = "search";
  input.placeholder = isESV ? "Search the ESV"
                    : isAB(S.translation) ? "Search isn't available here yet"
                    : "Search the books you have saved";
  input.value = searchQ; input.autocapitalize = "none"; input.autocorrect = "off";
  input.spellcheck = false;
  wrap.appendChild(input);

  /* The offline sheet promises the query never leaves the phone. That stops
     being true on the ESV, so say so rather than quietly breaking it. */
  if (isESV) wrap.appendChild(Object.assign(el("div","note"), { textContent:
    "The ESV cannot be stored on the device, so it is searched at Crossway and " +
    "your query is sent to them. Searching a saved book never leaves the phone." }));

  const status = el("div","scount");
  const list = el("div","results");
  wrap.append(status, list);
  body.appendChild(wrap);

  if (isESV) return drawESVSearch(input, status, list);

  /* Offline search reads the books you have saved, and these translations
     cannot be saved yet -- so the usual "download a book" advice would be
     advice to press a button that is switched off. API.Bible has a search
     endpoint of its own; it is simply not built. Say that plainly. */
  if (isAB(S.translation)){
    input.disabled = true;
    list.appendChild(Object.assign(el("div","note"), { textContent:
      "Search doesn't cover this translation yet. It searches books saved on the " +
      "device, and this one stays live. Switch to a free translation to search, or " +
      "read on here." }));
    return;
  }

  const saved = [...offlineBooks].filter(k => k.startsWith(S.translation + "/"));
  if (!saved.length){
    list.appendChild(Object.assign(el("div","note"), { textContent:
      "Search looks through the books you have saved for offline reading, so it works with " +
      "no signal and never sends your query anywhere. Download a book from the passage " +
      "list and it will appear here." }));
    return;
  }

  const render = async () => {
    const mine = ++searchSeq;
    const q = searchQ.trim();
    list.innerHTML = "";
    if (q.length < 2){
      status.textContent = `${saved.length} book${saved.length === 1 ? "" : "s"} saved \u00b7 type to search`;
      return;
    }
    status.textContent = "Searching\u2026";
    const corpus = await buildCorpus(S.translation,
      (d, t) => { if (mine === searchSeq && t > 1) status.textContent = `Reading ${d}/${t}\u2026`; });
    if (mine !== searchSeq) return;          // a newer keystroke already won

    const { hits, total, parsed } = runSearch(corpus, q);
    if (!total){ status.textContent = "No verses found."; return; }

    const books = new Set(hits.map(h => h.b));
    status.textContent = `${total} verse${total === 1 ? "" : "s"} in ` +
      (books.size === 1 ? byId[[...books][0]].name : `${books.size} books`) +
      (total > hits.length ? ` \u00b7 showing the first ${hits.length}` : "");

    const frag = document.createDocumentFragment();
    for (const h of hits) frag.appendChild(resultRow(h, parsed));
    list.appendChild(frag);
  };

  let t;
  input.oninput = () => { searchQ = input.value; clearTimeout(t); t = setTimeout(render, 160); };
  input.onkeydown = (e) => { if (e.key === "Enter"){ e.preventDefault(); clearTimeout(t); render(); } };
  render();
  if (!searchQ) setTimeout(() => input.focus(), 60);
}

/* Enter-to-search, not type-ahead: every keystroke would be a billed network
   round-trip against a 60/minute cap. */
function drawESVSearch(input, status, list){
  const PROMPT = "Type a word or a \u201cquoted phrase\u201d, then press Enter.";

  if (!S.esvKey){
    list.appendChild(Object.assign(el("div","note"), { textContent:
      "Add your ESV API key under Translation and the whole ESV becomes searchable \u2014 " +
      "not only the books you have saved." }));
    input.disabled = true;
    return;
  }

  const more = el("button","pillbtn","Load more");
  more.style.display = "block";
  more.style.margin = "16px auto 0";

  const paint = () => {
    const parsed = parseQuery(esvSearch.q);
    list.innerHTML = "";
    const frag = document.createDocumentFragment();
    for (const h of esvSearch.hits) frag.appendChild(resultRow(h, parsed));
    list.appendChild(frag);
    const shown = esvSearch.hits.length;
    status.textContent = `${esvSearch.total} verse${esvSearch.total === 1 ? "" : "s"}` +
      (shown < esvSearch.total ? ` \u00b7 showing the first ${shown}` : "");
    if (esvSearch.page < esvSearch.pages) list.appendChild(more);
  };

  /* The query is passed in, never read from the field: "Load more" must
     page the search the results actually belong to, not whatever has been
     typed since. */
  const run = async (q, page) => {
    if (q.length < 2){ status.textContent = PROMPT; return; }
    const mine = ++searchSeq;
    status.textContent = page > 1 ? "Loading more\u2026" : "Searching\u2026";
    more.disabled = true;
    try {
      const r = await searchESV(S.esvKey, q, page);
      if (mine !== searchSeq) return;        // a newer search already won
      esvSearch = (page > 1 && esvSearch.q === q)
        ? { ...r, q, hits: esvSearch.hits.concat(r.hits) }
        : { ...r, q };
      if (!esvSearch.total){ list.innerHTML = ""; status.textContent = "No verses found."; return; }
      paint();
    } catch (err){
      if (mine !== searchSeq) return;
      list.innerHTML = "";
      status.textContent = err.message === "badkey"
        ? "Crossway refused the key. Check it under Translation."
        : "Could not reach Crossway. Check your connection.";
    } finally {
      more.disabled = false;
    }
  };

  more.onclick = () => run(esvSearch.q, esvSearch.page + 1);
  input.oninput = () => {
    searchQ = input.value;
    if (searchQ.trim() !== esvSearch.q) status.textContent = "Press Enter to search.";
  };
  /* blur so the keyboard drops and the results are actually visible. */
  input.onkeydown = (e) => {
    if (e.key === "Enter"){ e.preventDefault(); input.blur(); run(searchQ.trim(), 1); }
  };

  if (esvSearch.q && esvSearch.q === searchQ.trim() && esvSearch.hits.length) paint();
  else status.textContent = PROMPT;

  if (!searchQ) setTimeout(() => input.focus(), 60);
}

function pickESV(){
  S.translation = "ESV"; S.translationName = "English Standard Version";
  chapterCache.clear(); save(); closeSheet(); open(S.book, S.chapter);
}

function pickAB(b){
  S.translation = AB_TAG + b.id;
  S.translationName = b.name;
  S.abAbbr = b.abbr || b.name.slice(0, 3).toUpperCase();
  chapterCache.clear(); save(); closeSheet(); open(S.book, S.chapter);
}

/* Everything the key can reach, in English, deduped -- the list repeats ids
   (WEB appears four times, KJV twice), so identity is the id and nothing
   else. */
/* The free list, fetched once and shared. It is also what the API.Bible
   list is filtered against, so both need the same answer. */
let aoPromise = null;
function aoTranslations(){
  return aoPromise || (aoPromise = fetch(`${AO}/api/available_translations.json`)
    .then(r => r.json())
    .then(data => (data.translations || data || [])
      .filter(t => (t.language === "eng" || t.languageEnglishName === "English"))
      .sort((a, b) => (a.englishName||a.name).localeCompare(b.englishName||b.name)))
    .catch(() => [{ id:"BSB", name:"Berean Standard Bible", englishName:"Berean Standard Bible", licenseNotes:"public domain" }]));
}

async function abFetchBibles(key){
  const res = await fetch(`${AB}/bibles`, { headers: { "api-key": key.trim() } });
  if (res.status === 401 || res.status === 403) throw new Error("badkey");
  if (!res.ok) throw new Error(`${res.status}`);
  /* Their catalogue carries no flag saying which Bibles are the licensed
     ones -- the three picked in the dashboard look exactly like the 37
     public-domain texts beside them. But HelloAO already gives most of
     those away free, cacheable and searchable, so anything with a matching
     abbreviation is dropped: reading it through the key would spend a
     metered call on text that is free below, and offer no search and no
     offline copy in exchange. What is left is what the key actually ADDS. */
  /* Matched on id AND shortName, because HelloAO's id is often `eng_kjv`
     while the abbreviation a reader recognises lives in shortName. Exact
     matches only, deliberately: a fuzzy name match would eventually hide a
     LICENSED translation behind a similarly-named free one, and a missing
     row is a far worse failure here than a duplicated one. */
  const free = new Set();
  for (const t of await aoTranslations()){
    if (t.id) free.add(String(t.id).toUpperCase());
    if (t.shortName) free.add(String(t.shortName).toUpperCase());
  }
  const seen = new Map(), byAbbr = new Set();
  for (const b of (await res.json()).data || []){
    if (!b || !b.id || seen.has(b.id)) continue;
    if ((b.language && b.language.id) !== "eng") continue;
    const abbr = b.abbreviationLocal || b.abbreviation || "";
    const up = abbr.toUpperCase();
    if (free.has(up)) continue;
    /* The list also repeats a translation under two ids -- two Berean
       Standard Bibles, four World English Bibles. One row each. */
    if (up && byAbbr.has(up)) continue;
    if (up) byAbbr.add(up);
    seen.set(b.id, { id:b.id, name:b.name || b.id, abbr });
  }
  return [...seen.values()].sort((x, y) => x.name.localeCompare(y.name));
}

async function drawTranslations(body){
  const back = $("#sheet-back");
  back.hidden = false;

  /* Once a key is saved the ESV is simply another translation, so it sits
     in a list like the rest instead of behind a form that never goes away.
     The form returns on demand, and only then. */
  if (S.esvKey && !esvKeyOpen){
    body.appendChild(Object.assign(el("div","group-title"), { textContent:"With your key" }));
    const mine = el("div","tlist");
    const b = el("button");
    b.append(el("b", null, "English Standard Version"), el("i", null, "ESV"));
    if (S.translation === "ESV") b.setAttribute("aria-current","true");
    b.onclick = pickESV;
    mine.appendChild(b);
    body.appendChild(mine);

    const note = el("div","note");
    note.appendChild(document.createTextNode(
      "Read live from Crossway. Licensed text, so it can't be saved for offline reading. "));
    const chg = el("button","linkish","Change key");
    chg.onclick = () => { esvKeyOpen = true; drawSheet(); };
    note.appendChild(chg);
    body.appendChild(note);
  } else {
    const esv = el("div");
    esv.appendChild(Object.assign(el("div","group-title"), { textContent:"English Standard Version" }));
    const keyRow = el("div","row");
    keyRow.style.display = "block";
    const input = document.createElement("input");
    input.type = "password"; input.placeholder = "ESV API key"; input.value = S.esvKey;
    input.autocomplete = "off"; input.spellcheck = false;
    keyRow.appendChild(input);
    const useBtn = el("button","pillbtn primary","Read the ESV");
    useBtn.style.marginTop = "10px";
    useBtn.onclick = () => {
      const k = input.value.trim();
      if (!k) { toast("Enter a key first"); return; }
      S.esvKey = k; esvKeyOpen = false;
      pickESV();
    };
    keyRow.appendChild(useBtn);
    if (S.esvKey){
      const forget = el("button","pillbtn","Forget key");
      forget.style.marginTop = "10px"; forget.style.marginLeft = "8px";
      forget.onclick = () => {
        S.esvKey = ""; esvKeyOpen = false;
        /* Don't leave the reader pointed at a translation it can no longer
           fetch. */
        if (S.translation === "ESV"){
          S.translation = "BSB"; S.translationName = "Berean Standard Bible";
          chapterCache.clear(); save(); closeSheet(); open(S.book, S.chapter); return;
        }
        save(); drawSheet();
      };
      keyRow.appendChild(forget);
    }
    esv.appendChild(keyRow);
    esv.appendChild(Object.assign(el("div","note"), {
      innerHTML: 'Keys are free for personal use from <a href="https://api.esv.org" target="_blank" rel="noopener">api.esv.org</a>. The key stays on this device and is sent only to Crossway.'
    }));
    body.appendChild(esv);
  }


  /* ── API.Bible ── same bargain as the ESV: your key, held on this device,
     and the translation is switched off the moment you forget it. What
     differs is that the key decides WHICH texts exist -- three licensed
     Bibles are chosen in their dashboard, not here -- so the list is read
     from the key rather than written into the app. */
  if (S.abKey && !abKeyOpen){
    body.appendChild(Object.assign(el("div","group-title"), { textContent:"With your API.Bible key" }));
    const mine = el("div","tlist");
    body.appendChild(mine);

    const drawList = () => {
      mine.innerHTML = "";
      for (const t of abBibles){
        const b = el("button");
        b.append(el("b", null, t.name), el("i", null, t.abbr));
        if (S.translation === AB_TAG + t.id) b.setAttribute("aria-current","true");
        b.onclick = () => pickAB(t);
        mine.appendChild(b);
      }
    };

    const note = el("div","note");
    note.appendChild(document.createTextNode(
      "Read live from API.Bible. Licensed text, so it isn't saved for offline reading. " +
      "Translations that are already free below aren't repeated here. "));
    const chg = el("button","linkish","Change key");
    chg.onclick = () => { abKeyOpen = true; drawSheet(); };
    note.appendChild(chg);
    body.appendChild(note);

    if (abBibles) drawList();
    else {
      /* Deliberately NOT awaited: the free translations below must not wait
         on a network call to a service the reader may not even use. */
      const load = el("div","state"); load.appendChild(el("div","spin"));
      mine.appendChild(load);
      abFetchBibles(S.abKey).then(list => {
        if (sheetView !== "translations") return;
        abBibles = list; drawList();
      }).catch(err => {
        if (sheetView !== "translations") return;
        mine.innerHTML = "";
        mine.appendChild(Object.assign(el("div","note"), { textContent:
          err.message === "badkey" ? "That key was refused. Check it and try again."
                                   : "Couldn't reach API.Bible just now." }));
      });
    }
  } else {
    const ab = el("div");
    ab.appendChild(Object.assign(el("div","group-title"), { textContent:"API.Bible" }));
    const keyRow = el("div","row");
    keyRow.style.display = "block";
    const input = document.createElement("input");
    input.type = "password"; input.placeholder = "API.Bible key"; input.value = S.abKey;
    input.autocomplete = "off"; input.spellcheck = false;
    keyRow.appendChild(input);
    const useBtn = el("button","pillbtn primary","Use this key");
    useBtn.style.marginTop = "10px";
    useBtn.onclick = async () => {
      const k = input.value.trim();
      if (!k) { toast("Enter a key first"); return; }
      useBtn.disabled = true; useBtn.textContent = "Checking…";
      try {
        abBibles = await abFetchBibles(k);
      } catch (err){
        useBtn.disabled = false; useBtn.textContent = "Use this key";
        toast(err.message === "badkey" ? "That key was refused" : "Couldn't reach API.Bible");
        return;
      }
      S.abKey = k; abKeyOpen = false; save();
      drawSheet();
    };
    keyRow.appendChild(useBtn);
    if (S.abKey){
      const forget = el("button","pillbtn","Forget key");
      forget.style.marginTop = "10px"; forget.style.marginLeft = "8px";
      forget.onclick = () => {
        S.abKey = ""; S.abAbbr = ""; abKeyOpen = false; abBibles = null;
        /* Don't leave the reader pointed at a translation it can no longer
           fetch. */
        if (isAB(S.translation)){
          S.translation = "BSB"; S.translationName = "Berean Standard Bible";
          chapterCache.clear(); save(); closeSheet(); open(S.book, S.chapter); return;
        }
        save(); drawSheet();
      };
      keyRow.appendChild(forget);
    }
    ab.appendChild(keyRow);
    ab.appendChild(Object.assign(el("div","note"), {
      innerHTML: 'A free key from <a href="https://api.bible" target="_blank" rel="noopener">api.bible</a> carries three licensed translations of your choosing — the NIV, NASB, NLT, The Message and the Amplified are among them. The key stays on this device and is sent only to API.Bible.'
    }));
    body.appendChild(ab);
  }

  body.appendChild(Object.assign(el("div","group-title"), { textContent:"Free to read and to keep" }));
  const list = el("div","tlist");
  body.appendChild(list);

  /* Our "copyright page". Crossway's API terms want the full notice once
     somewhere on the site; this is that somewhere. See ESV_NOTICE. Appended
     before the translation fetch so it doesn't pop in late. */
  body.appendChild(Object.assign(el("div","group-title"), { textContent:"Copyright" }));
  const cr = el("div","note");
  ESV_NOTICE.split(/\n{2,}/).forEach((para, i) => {
    const n = el("p", null, para);
    n.style.marginTop = i ? ".9em" : "0";
    n.style.marginBottom = "0";
    cr.appendChild(n);
  });
  /* API.Bible's Starter terms ask for a visible citation and hyperlink to
     api.bible. Each chapter's colophon carries it too, next to the
     publisher's own link; this is the site-wide half. Each publisher's full
     notice travels with the text and is shown under the chapter. */
  if (S.abKey){
    const n = el("p");
    n.style.marginTop = ".9em"; n.style.marginBottom = "0";
    n.appendChild(document.createTextNode("Licensed translations are delivered by "));
    const a = el("a", null, "API.Bible");
    a.href = "https://api.bible"; a.target = "_blank"; a.rel = "noopener";
    n.appendChild(a);
    n.appendChild(document.createTextNode(", a service of the American Bible Society. Each publisher's notice is shown at the foot of the chapter it belongs to."));
    cr.appendChild(n);
  }
  body.appendChild(cr);

  if (!translations){
    const load = el("div","state"); load.appendChild(el("div","spin"));
    list.appendChild(load);
    translations = await aoTranslations();
    if (sheetView !== "translations") return;
    list.innerHTML = "";
  }

  for (const t of translations){
    const b = el("button");
    b.append(el("b", null, t.englishName || t.name), el("i", null, t.id));
    if (t.id === S.translation) b.setAttribute("aria-current","true");
    b.onclick = () => {
      S.translation = t.id;
      S.translationName = t.englishName || t.name;
      chapterCache.clear();
      save(); closeSheet(); open(S.book, S.chapter);
    };
    list.appendChild(b);
  }
}

/* ══════════════════════════════════════════════════════════════
   10 · Offline download
   ══════════════════════════════════════════════════════════════ */
async function downloadBook(btn){
  const bookId = S.book, tid = S.translation, bk = byId[bookId];
  btn.disabled = true;
  const nums = Array.from({ length: bk.chapters }, (_, i) => i + 1);
  const out = {};
  let done = 0, failed = false;

  const label = () => { btn.textContent = `${done}/${bk.chapters}`; };
  label();

  const worker = async () => {
    while (nums.length && !failed){
      const c = nums.shift();
      try {
        const key = `${tid}/${bookId}/${c}`;
        const data = chapterCache.get(key) || await fetchAO(tid, bookId, c);
        chapterCache.set(key, data);
        out[c] = data;
      } catch (_){ failed = true; }
      done++; label();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);

  btn.disabled = false;
  if (failed){ btn.textContent = "Download"; toast("Download stopped — check the connection"); return; }

  const ok = await Store.set(`bk:${tid}:${bookId}`, out);
  if (!ok){ btn.textContent = "Download"; toast("That book was too large to store"); return; }
  offlineBooks.add(`${tid}/${bookId}`);
  corpusCache.delete(tid);                  // the shelf changed; rebuild on next search
  const idx = (await Store.get("offline")) || [];
  if (!idx.includes(`${tid}/${bookId}`)) { idx.push(`${tid}/${bookId}`); await Store.set("offline", idx); }
  toast(`${bk.name} saved for offline`);
  drawSheet();
}

async function removeBook(btn){
  btn.disabled = true;
  await Store.del(`bk:${S.translation}:${S.book}`);
  offlineBooks.delete(`${S.translation}/${S.book}`);
  corpusCache.delete(S.translation);
  const idx = ((await Store.get("offline")) || []).filter(k => k !== `${S.translation}/${S.book}`);
  await Store.set("offline", idx);
  btn.disabled = false;
  toast(`${byId[S.book].name} removed`);
  drawSheet();
}

/* ══════════════════════════════════════════════════════════════
   11 · Misc
   ══════════════════════════════════════════════════════════════ */
let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}

async function requestWake(){
  try { wakeLock = await navigator.wakeLock.request("screen"); }
  catch (_) { S.awake = false; toast("This browser won't keep the screen on"); }
}
function releaseWake(){ if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (S.awake && !wakeLock) requestWake();
  /* Backgrounding kills the utterance on iOS while Speech.on stays true,
     which would leave the button reading "Stop" over silence. Pick the
     verse back up instead. */
  if (Speech.on && !speechSynthesis.speaking && !speechSynthesis.pending) speakNext();
});

if (speechOK()){
  loadVoices();
  /* Both Safari and Chrome populate the voice list asynchronously, so
     without this the first Listen gets whatever the default happens to be
     rather than the chosen voice. */
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
}

function redrawKeepScroll(){
  const span = () => document.documentElement.scrollHeight - window.innerHeight;
  const before = span();
  const ratio = before > 0 ? window.scrollY / before : 0;
  const cached = chapterCache.get(`${S.translation}/${S.book}/${S.chapter}`);
  if (!cached) return;
  renderChapter(cached);
  requestAnimationFrame(() => {
    window.scrollTo(0, ratio * Math.max(0, span()));
    updateProgress();
  });
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    Store.set("settings", {
      translation:S.translation, translationName:S.translationName, esvKey:S.esvKey,
      /* abDev belongs here with the keys, not with the look-and-feel: a
         device id that regenerates every launch would report one reader as
         a new reader each time, which is the opposite of what FUMS is
         counting. */
      abKey:S.abKey, abAbbr:S.abAbbr, abDev:S.abDev,
      theme:S.theme, bookOrder:S.bookOrder, lum:S.lum, warm:S.warm, fs:S.fs, lh:S.lh, measure:S.measure,
      face:S.face, verses:S.verses, layout:S.layout, woc:S.woc,
      awake:S.awake, autohide:S.autohide,
      rate:S.rate, voice:S.voice, listen:S.listen
    });
    Store.set("position", { book:S.book, chapter:S.chapter });
  }, 250);
}

/* ══════════════════════════════════════════════════════════════
   12 · Input
   ══════════════════════════════════════════════════════════════ */
const reader = $("#reader");

let lastY = 0, accUp = 0;
window.addEventListener("scroll", () => {
  updateProgress();
  const y = window.scrollY;
  const dy = y - lastY;
  if (dy > 4){ accUp = 0; hideChrome(); }
  else if (dy < 0){
    accUp += -dy;
    if (accUp > 26 || y < 12){ accUp = 0; showChrome(); }
  }
  lastY = y;
}, { passive: true });

/* On a phone the chrome comes back on scroll-up or a tap, and both are
   things a thumb does constantly. A mouse does neither while reading, so on
   a pointer device the bars are otherwise gone until you think to click the
   text. Approaching either edge is the desktop convention for reclaiming
   hidden chrome, and it stays out of the way in the middle of the window —
   which is where a reader's cursor sits. Guarded on pointerType so a
   stylus or a finger generating pointer events cannot trip it. */
if (matchMedia("(hover:hover) and (pointer:fine)").matches){
  window.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    if (document.body.classList.contains("sheet-open")) return;
    const edge = 72;
    if (e.clientY < edge || e.clientY > window.innerHeight - edge) showChrome();
  }, { passive:true });
}

reader.addEventListener("click", (e) => {
  if (e.target.closest("a,button")) return;
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;
  toggleChrome();
});

let tx = 0, ty = 0, tt = 0, swiping = false;
reader.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) { swiping = false; return; }
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); swiping = true;
}, { passive: true });

reader.addEventListener("touchend", (e) => {
  if (!swiping) return;
  swiping = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty;
  if (Date.now() - tt > 700) return;
  if (Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.7) return;
  go(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Escape" && document.body.classList.contains("sheet-open")) { closeSheet(); return; }
  if (e.key === "ArrowRight" || e.key === "l") go(1);
  else if (e.key === "ArrowLeft" || e.key === "h") go(-1);
  else if (e.key === "g") openSheet("passage");
  else if (e.key === "." ) toggleChrome();
});

$("#btn-passage").onclick = () => openSheet("passage");
$("#btn-trans").onclick   = () => openSheet("translations");
$("#btn-settings").onclick= () => openSheet("settings");
$("#btn-search").onclick  = () => openSheet("search");
$("#btn-speak").onclick   = () => { showChrome(); speakToggle(); };
$("#btn-prev").onclick    = () => go(-1);
$("#btn-next").onclick    = () => go(1);
$("#sheet-close").onclick = closeSheet;
$("#scrim").onclick       = closeSheet;
$("#sheet-back").onclick  = () => {
  if (sheetView === "passage" && pickedBook){ pickedBook = null; drawSheet(); }
  else openSheet("settings");
};
/* drag the sheet down to dismiss */
(() => {
  const sheet = $("#sheet");
  let y0 = null;
  sheet.addEventListener("touchstart", (e) => {
    if (!e.target.closest(".sheet-grip") && !e.target.closest(".sheet-head")) return;
    y0 = e.touches[0].clientY; sheet.style.transition = "none";
  }, { passive:true });
  sheet.addEventListener("touchmove", (e) => {
    if (y0 == null) return;
    const d = Math.max(0, e.touches[0].clientY - y0);
    /* --drag, not style.transform: the sheet composes its own centring into
       that property on a wide screen and assigning it would drop it. */
    sheet.style.setProperty("--drag", d + "px");
  }, { passive:true });
  sheet.addEventListener("touchend", (e) => {
    if (y0 == null) return;
    const d = Math.max(0, e.changedTouches[0].clientY - y0);
    sheet.style.transition = ""; sheet.style.removeProperty("--drag");
    y0 = null;
    if (d > 90) closeSheet();
  });
})();

/* ══════════════════════════════════════════════════════════════
   13 · Boot
   ══════════════════════════════════════════════════════════════ */
(async function boot(){
  const saved = await Store.get("settings");
  if (saved) Object.assign(S, saved);
  /* ?listen turns the listening layout on for THIS load without changing
     the stored preference, so the URL can be bookmarked and handed to a
     read-aloud browser while the app itself still opens the way you left it. */
  listenView = S.listen || /[?&]listen(=1|=true)?(&|$)/.test(location.search);
  const pos = await Store.get("position");
  if (pos && byId[pos.book]) { S.book = pos.book; S.chapter = pos.chapter; }
  for (const k of (await Store.get("offline")) || []) offlineBooks.add(k);

  applyLook();
  syncChrome();
  if (S.awake) requestWake();

  showState(null);
  await open(S.book, S.chapter, { animate:false });
  showChrome();
})();

/* Repaint when the system flips, but only while the user has asked us to
   follow it. Sheet is redrawn too so the "dark right now" line stays true. */
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
  if (S.theme !== "auto") return;
  applyLook();
  if (document.body.classList.contains("sheet-open")) drawSheet();
});

/* ══════════════════════════════════════════════════════════════
   15 · Service worker — offline shell
   Registered last, and deliberately never awaited: a worker that
   fails to install must not keep the reader from opening.
   Needs a secure context, so this is inert over plain http:// on a
   LAN address (same constraint as Wake Lock) — https or localhost.
   ══════════════════════════════════════════════════════════════ */
if ("serviceWorker" in navigator && window.isSecureContext) {
  addEventListener("load", () => {
    /* Relative path, so scope follows the directory the app is served
       from: / locally, /vigil/ on Pages. */
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
  /* Re-ask when a new worker takes over, so the About row cannot go stale
     while the sheet is open. */
  navigator.serviceWorker.addEventListener("controllerchange", askWorkerVersion);
  askWorkerVersion();
}
</script>
